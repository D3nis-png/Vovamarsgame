<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Марс: заброшенные станции (2DS)</title>
<style>
  body { background: #050b07; color: #c9f5d6; font-family: monospace; font-size: 12px; margin: 0; padding: 5px; }
  .box { background: #0b1710; border: 1px solid #17402a; padding: 5px; margin-bottom: 5px; }
  button { background: #10241a; color: #c9f5d6; border: 1px solid #17402a; padding: 6px 8px; margin: 2px; cursor: pointer; font-family: monospace; font-size: 12px; }
  .p { background: #2fe06a; color: #03140a; }
  .log { height: 60px; overflow: hidden; color: #6fa381; font-size: 11px; }
</style>
</head>
<body>

<div class="box" id="statusBox">
  <b>Ядро:</b> <span id="hp">20/20</span> | <b>Энергия:</b> <span id="en">60</span> | <b>Металл:</b> <span id="me">10</span>
</div>

<div class="box">
  <h3 id="stationTitle" style="margin:0 0 5px; font-size:12px; color:#6fa381;">Станция №1: Шлюз</h3>
  <div id="actionArea">
    <button class="p" onclick="doExplore()">Исследовать отсек</button>
  </div>
</div>

<div class="box">
  <h3 style="margin:0 0 3px; font-size:11px; color:#6fa381;">Журнал</h3>
  <div class="log" id="logBox">Система активирована. Добро пожаловать на Марс.</div>
</div>

<script>
var G = {
    hp: 20,
    max: 20,
    en: 60,
    me: 10,
    st: 1,
    roomsExplored: 1,
    totalRooms: 6
};

function logMsg(text) {
    document.getElementById('logBox').innerHTML = text;
}

function updateUI() {
    document.getElementById('hp').innerHTML = G.hp + '/' + G.max;
    document.getElementById('en').innerHTML = G.en;
    document.getElementById('me').innerHTML = G.me;
    document.getElementById('stationTitle').innerHTML = 'Станция №' + G.st + ' (Пройдено: ' + G.roomsExplored + '/' + G.totalRooms + ')';
}

function doExplore() {
    var r = Math.floor(Math.random() * 3);
    if (r === 0) {
        G.me += 4;
        logMsg('Вы нашли 4 ед. металла в отсеке.');
    } else if (r === 1) {
        G.en = Math.max(0, G.en - 10);
        logMsg('Утечка энергии! Потеряно 10 ⚡.');
    } else {
        G.roomsExplored++;
        logMsg('Отсек исследован. Чисто.');
    }
    
    if (G.roomsExplored >= G.totalRooms) {
        logMsg('Все отсеки станции исследованы! Данные можно передать.');
        document.getElementById('actionArea').innerHTML = '<button class="p" onclick="nextStation()">Лететь на след. станцию</button>';
    }
    
    updateUI();
}

function nextStation() {
    G.st++;
    G.roomsExplored = 1;
    G.totalRooms = 5 + Math.floor(Math.random() * 4);
    G.en = Math.min(100, G.en + 30);
    logMsg('Вы прибыли на новую станцию.');
    document.getElementById('actionArea').innerHTML = '<button class="p" onclick="doExplore()">Исследовать отсек</button>';
    updateUI();
}

// Инициализация при загрузке
window.onload = function() {
    updateUI();
};
</script>

</body>
</html>
