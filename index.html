<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Марс: заброшенные станции</title>
<style>
body { margin: 0; background: #010302; color: #b8f0c8; font-family: monospace; font-size: 11px; padding: 4px; display: flex; flex-direction: column; align-items: center; }
.console-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 6px; }

/* Верхний экран (эмуляция 800x240 / широкая панель) */
.screen-top { 
  background: #050d08; 
  border: 2px solid #143822; 
  border-radius: 6px; 
  padding: 6px; 
  min-height: 110px;
  box-sizing: border-box;
}

/* Нижний экран (эмуляция 320x240 / сенсорный пульт) */
.screen-bottom { 
  background: #030704; 
  border: 2px solid #1c4d30; 
  border-radius: 6px; 
  padding: 6px; 
  min-height: 140px;
  box-sizing: border-box;
}

.title { font-size: 10px; color: #528a64; text-transform: uppercase; margin-bottom: 2px; }
button { font: inherit; color: #b8f0c8; background: #0d2218; border: 1px solid #194a2f; border-radius: 4px; padding: 6px 9px; margin: 2px; cursor: pointer; }
button:disabled { opacity: 0.4; cursor: default; }
button.p { background: #25c458; color: #020a05; border-color: #25c458; font-weight: bold; }
.log-box { font-size: 9px; color: #528a64; max-height: 40px; overflow-y: auto; background: #010302; padding: 3px; border-radius: 3px; }
.alert { color: #ff5a5a; font-weight: bold; }
.ok { color: #25c458; }
.bad { color: #ff5a5a; }
.section-divider { border-top: 1px dashed #143822; margin: 4px 0; padding-top: 4px; }
</style>
</head>
<body>

<div class="console-container" id="app"></div>

<script>
function R(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function P(a) { return a[R(0, a.length - 1)]; }
function ch(p) { return Math.random() * 100 < p; }

var WEAPONS = [
  {n: 'Лазер', dmg: 4, acc: 80},
  {n: 'Рельса', dmg: 7, acc: 60},
  {n: 'Плазмоган', dmg: 6, acc: 70},
  {n: 'Дробовик', dmg: 5, acc: 75}
];

var MODULES = [
  {n: 'Броня', id: 'armor', desc: 'Защита'},
  {n: 'Прицел', id: 'sight', desc: 'Точность'},
  {n: 'Щит', id: 'shield', desc: 'Поглощение'},
  {n: 'Ремонтник', id: 'repair', desc: 'Ремонт ядра за 🔩'}
];

var RN = ['Шлюз', 'Склад', 'Реактор', 'Лаба', 'Жилой', 'Ангар', 'Мастерская'];
var G;

function genRooms(n) {
  var rooms = [];
  var i;
  for (i = 0; i < n; i++) {
    var type = 'x';
    if (i > 0) {
      var roll = R(1, 100);
      if (roll <= 40) type = 'e';
      else if (roll <= 80) type = 'l';
    }
    rooms.push({
      name: i === 0 ? 'Шлюз' : RN[i % RN.length],
      adj: [], type: type, vis: i === 0, clear: i === 0, loot: []
    });
  }
  for (i = 1; i < n; i++) {
    var prev = R(0, i - 1);
    if (rooms[i].adj.indexOf(prev) === -1) rooms[i].adj.push(prev);
    if (rooms[prev].adj.indexOf(i) === -1) rooms[prev].adj.push(i);
  }
  var g = R(1, n - 1);
  rooms[g].type = 'g';
  rooms[g].name = 'Дробилка';
  return rooms;
}

function genStation() {
  return {
    name: P(['Арес', 'Фобос', 'Деймос', 'Олимп', 'Тарсис']) + '-' + R(1, 99),
    rooms: genRooms(5), sent: false
  };
}

function newGame() {
  var st0 = genStation();
  G = {
    hp: 20, max: 20, en: 60, me: 20, ant: true, st: 1, cur: 0,
    weps: [{n: 'Лазер-1', dmg: 4, acc: 80}],
    mods: [],
    rooms: st0.rooms, fight: null, surf: false, replacingItem: null,
    sts: [st0, genStation(), genStation()],
    log: ['Система активна. База «' + st0.name + '».']
  };
  render();
}

function logMsg(txt) {
  G.log.push(txt);
  if (G.log.length > 3) G.log.shift();
}

function hasModule(id) {
  for (var i = 0; i < G.mods.length; i++) {
    if (G.mods[i].id === id) return true;
  }
  return false;
}

function go(idx) {
  if (G.en <= 0) { logMsg('Энергия на нуле!'); render(); return; }
  G.en--;
  G.cur = idx;
  var r = G.rooms[idx];
  r.vis = true;

  if (!r.clear) {
    if (r.type === 'e') {
      G.fight = {
        e: { name: P(['Дрон', 'Шагоход', 'Патрульный']) + '-' + R(10,99), core: 15, max: 15 },
        room: r
      };
      logMsg('Враг в отсеке «' + r.name + '»!');
    } else if (r.type === 'l') {
      r.clear = true;
      var foundMe = R(3, 7);
      G.me += foundMe;
      if (ch(50)) {
        var baseW = P(WEAPONS);
        r.loot.push({type: 'w', item: {n: baseW.n + '-' + R(1,9), dmg: baseW.dmg, acc: baseW.acc}});
        logMsg('Найдено оружие!');
      } else {
        var baseM = P(MODULES);
        r.loot.push({type: 'm', item: {n: baseM.n, id: baseM.id, desc: baseM.desc}});
        logMsg('Найден модуль (' + baseM.n + ')!');
      }
    } else {
      r.clear = true;
      logMsg('Отсек пуст.');
    }
  } else {
    logMsg('Переход в «' + r.name + '».');
  }
  render();
}

function shoot(wIdx) {
  var f = G.fight;
  if (!f) return;
  var w = G.weps[wIdx] || G.weps[0];
  var hitAcc = w.acc;
  if (hasModule('sight')) hitAcc += 10;

  if (ch(hitAcc)) {
    f.e.core -= w.dmg;
    logMsg(w.n + ': −' + w.dmg + ' HP врагу.');
  } else {
    logMsg(w.n + ': промах!');
  }

  if (f.e.core <= 0) {
    logMsg('Враг уничтожен! +8 🔩.');
    G.me += 8;
    if (ch(60)) {
      var bw = P(WEAPONS);
      f.room.loot.push({type: 'w', item: {n: bw.n + '-' + R(1,9), dmg: bw.dmg, acc: bw.acc}});
    }
    if (ch(40)) {
      var bm = P(MODULES);
      f.room.loot.push({type: 'm', item: {n: bm.n, id: bm.id, desc: bm.desc}});
    }
    f.room.clear = true;
    G.fight = null;
  } else {
    var dmg = R(2, 4);
    if (hasModule('armor')) dmg = Math.max(1, dmg - 1);
    G.hp -= dmg;
    logMsg('Удар по ядру: −' + dmg);
    if (G.hp <= 0) { logMsg('Ядро уничтожено!'); setTimeout(newGame, 2000); }
  }
  render();
}

function takeLoot(lootIdx) {
  var r = G.rooms[G.cur];
  var lootObj = r.loot[lootIdx];

  if (lootObj.type === 'w') {
    if (G.weps.length < 2) {
      G.weps.push(lootObj.item);
      r.loot.splice(lootIdx, 1);
      logMsg('Оружие взято.');
    } else {
      G.replacingItem = {lootIdx: lootIdx, item: lootObj.item};
      logMsg('Слоты полны (макс 2)! Выберите замену.');
    }
  } else if (lootObj.type === 'm') {
    G.mods.push(lootObj.item);
    r.loot.splice(lootIdx, 1);
    logMsg('Модуль «' + lootObj.item.n + '» установлен.');
  }
  render();
}

function replaceWeapon(slotIdx) {
  var rep = G.replacingItem;
  var r = G.rooms[G.cur];
  var oldWep = G.weps[slotIdx];

  G.weps[slotIdx] = rep.item;
  r.loot[rep.lootIdx] = {type: 'w', item: oldWep};
  G.replacingItem = null;
  logMsg('Оружие заменено.');
  render();
}

function cancelReplace() {
  G.replacingItem = null;
  render();
}

function repairAntenna() {
  if (G.me >= 12) {
    G.me -= 12;
    G.ant = true;
    logMsg('Антенна починена (−12🔩).');
    render();
  }
}

function repairCore() {
  if (G.me >= 6 && G.hp < G.max) {
    G.me -= 6;
    G.hp = Math.min(G.max, G.hp + 5);
    logMsg('Ядро отремонтировано (+5 HP, −6🔩).');
    render();
  }
}

function sendData() {
  var st = G.sts[G.st - 1];
  st.sent = true;
  logMsg('Данные станции №' + G.st + ' переданы на Землю!');
  render();
}

function surf() {
  if (G.en < 5) return;
  G.en -= 5; G.fight = null; G.surf = true;
  render();
}

function drive(k) {
  G.surf = false; G.st = k + 1;
  var s = G.sts[k];
  G.rooms = s.rooms; G.cur = 0;
  logMsg('Станция №' + G.st + ' «' + s.name + '».');
  render();
}

function render() {
  var A = document.getElementById('app');
  var topHtml = '';
  var botHtml = '';

  var clearedCount = 0;
  for (var d = 0; d < G.rooms.length; d++) {
    if (G.rooms[d].clear) clearedCount++;
  }
  var currentSt = G.sts[G.st - 1];

  // === ВЕРХНИЙ ЭКРАН (Инфо, Статус, Инвентарь, Лог) ===
  topHtml += '<div class="screen-top">';
  
  topHtml += '<div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:3px;">';
  topHtml += '<span>HP: ' + G.hp + '/' + G.max + '</span>';
  topHtml += '<span>⚡: ' + G.en + '</span>';
  topHtml += '<span>🔩: ' + G.me + '</span>';
  topHtml += '<span>Антенна: <b class="' + (G.ant ? 'ok' : 'bad') + '">' + (G.ant ? 'ОК' : 'Сломана') + '</b></span>';
  topHtml += '</div>';

  topHtml += '<div class="section-divider"></div>';

  topHtml += '<div class="title">Снаряжение (' + G.weps.length + '/2 оружия):</div>';
  for (var sw = 0; sw < G.weps.length; sw++) {
    topHtml += '<span style="margin-right:6px;">🔫 <b>' + G.weps[sw].n + '</b>[' + G.weps[sw].dmg + 'д]</span>';
  }
  if (G.mods.length > 0) {
    topHtml += '<br><span class="title" style="margin-top:2px;">Модули:</span> ';
    for (var sm = 0; sm < G.mods.length; sm++) {
      topHtml += '<b>' + G.mods[sm].n + '</b> ';
    }
  }

  topHtml += '<div class="section-divider"></div>';

  topHtml += '<div class="title">Журнал</div><div class="log-box">';
  for (var l = 0; l < G.log.length; l++) {
    topHtml += '<div>' + G.log[l] + '</div>';
  }
  topHtml += '</div>';

  topHtml += '</div>';


  // === НИЖНИЙ ЭКРАН (Сенсорный пульт управления) ===
  botHtml += '<div class="screen-bottom">';

  if (G.surf) {
    botHtml += '<div class="title">Поверхность Марса (Выбор базы)</div>';
    for (var i = 0; i < G.sts.length; i++) {
      botHtml += '<div style="margin:3px 0;"><b>№' + (i+1) + ' «' + G.sts[i].name + '»</b> ' + (G.sts[i].sent ? '<span class="ok">(✓ передана)</span>' : '') + '<br>';
      botHtml += '<button class="p" onclick="drive(' + i + ')">' + (i + 1 === G.st ? 'Вернуться на базу' : 'Лететь сюда') + '</button></div>';
    }
    botHtml += '<button onclick="G.surf=false;render()">Назад на базу</button>';
  } else {
    var r = G.rooms[G.cur];
    botHtml += '<div class="title">Станция №' + G.st + ' («' + currentSt.name + '») · ' + r.name + ' (' + clearedCount + '/' + G.rooms.length + ')</div>';

    if (G.fight) {
      var e = G.fight.e;
      botHtml += '<div class="alert">БОЙ: ' + e.name + ' (HP:' + e.core + ')</div>';
      botHtml += '<div class="title" style="margin-top:3px;">Выберите оружие:</div>';
      for (var w = 0; w < G.weps.length; w++) {
        botHtml += '<button class="p" onclick="shoot(' + w + ')">' + G.weps[w].n + ' (' + G.weps[w].dmg + 'д)</button> ';
      }
    } else {
      botHtml += '<div class="title">Движение по отсекам:</div>';
      for (var j = 0; j < r.adj.length; j++) {
        var nIdx = r.adj[j];
        var nr = G.rooms[nIdx];
        botHtml += '<button onclick="go(' + nIdx + ')">' + nr.name + (nr.clear ? ' (✓)' : ' (⚔)') + '</button>';
      }

      if (r.loot.length > 0) {
        botHtml += '<div class="title" style="color:#25c458; margin-top:3px;">Находки в отсеке:</div>';
        for (var lt = 0; lt < r.loot.length; lt++) {
          var it = r.loot[lt];
          botHtml += '<div style="font-size:10px; margin:2px 0;">' + (it.type === 'w' ? '🔫 ' + it.item.n + ' (' + it.item.dmg + 'д)' : '⚙️ ' + it.item.n) + ' ';
          botHtml += '<button class="p" onclick="takeLoot(' + lt + ')">Взять</button></div>';
        }
      }

      if (G.replacingItem) {
        botHtml += '<div style="border:1px solid #ff5a5a; padding:3px; margin-top:3px; border-radius:3px;">';
        botHtml += '<div class="alert">Инвентарь полон (2/2)! Заменить слот:</div>';
        for (var sl = 0; sl < G.weps.length; sl++) {
          botHtml += '<button onclick="replaceWeapon(' + sl + ')">Слот ' + (sl+1) + ': ' + G.weps[sl].n + '</button> ';
        }
        botHtml += '<br><button onclick="cancelReplace()">Отмена</button>';
        botHtml += '</div>';
      }

      botHtml += '<div style="margin-top:4px; border-top:1px solid #1c4d30; padding-top:3px;">';
      if (hasModule('repair')) {
        botHtml += '<button onclick="repairCore()" ' + (G.me >= 6 && G.hp < G.max ? '' : 'disabled') + '>Ремонт ядра (+5HP / 6🔩)</button>';
      }
      if (!G.ant) {
        botHtml += '<button onclick="repairAntenna()" ' + (G.me >= 12 ? '' : 'disabled') + '>Починить антенну (12🔩)</button>';
      }
      botHtml += '<button class="p" onclick="sendData()" ' + (clearedCount === G.rooms.length && G.ant && !currentSt.sent ? '' : 'disabled') + '>Передать данные</button>';
      if (G.cur === 0) {
        botHtml += '<button onclick="surf()">Поверхность (5⚡)</button>';
      }
      botHtml += '</div>';
    }
  }

  botHtml += '</div>';

  A.innerHTML = topHtml + botHtml;
}

newGame();
</script>

</body>
</html>
