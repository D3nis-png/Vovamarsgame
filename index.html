<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Марс: Заброшенные станции (2DS Fix)</title>
<style>
/* 
  Nintendo 2DS Retro Safe Styles
  No flex, no grid, no calc, no modern variables.
  Using standard block layouts and tables for 100% rendering reliability.
*/
body {
  background-color: #000000;
  color: #00FF66;
  font-family: monospace;
  font-size: 12px;
  margin: 0;
  padding: 4px;
}
.screen-frame {
  background-color: #051A0A;
  border: 2px solid #00FF66;
  padding: 4px;
  margin-bottom: 6px;
  width: 300px;
}
.screen-title {
  font-size: 10px;
  color: #00AA44;
  border-bottom: 1px solid #00AA44;
  margin-bottom: 4px;
  padding-bottom: 2px;
}
.panel {
  background-color: #0A2E14;
  border: 1px solid #00FF66;
  padding: 4px;
  margin-bottom: 4px;
}
table.stats {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 4px;
}
table.stats td {
  border: 1px solid #00AA44;
  text-align: center;
  padding: 2px;
  font-size: 11px;
}
table.stats b {
  color: #FFFFFF;
  display: block;
}
button {
  font-family: monospace;
  background-color: #0A2E14;
  color: #00FF66;
  border: 1px solid #00FF66;
  padding: 4px 6px;
  margin: 2px;
  font-size: 11px;
  cursor: pointer;
}
button.active {
  background-color: #00FF66;
  color: #000000;
  font-weight: bold;
}
button:disabled {
  color: #555555;
  border-color: #333333;
  background-color: #020A04;
}
.log-box {
  background-color: #020803;
  border: 1px solid #005522;
  padding: 3px;
  font-size: 10px;
  color: #88FFAA;
  height: 40px;
  overflow: hidden;
}
.red { color: #FF4444; }
.yellow { color: #FFFF44; }
.green { color: #44FF44; }
</style>
</head>
<body>

<div class="screen-frame">
  <div class="screen-title">-- ЭКРАН 1: ТЕЛЕМЕТРИЯ И СОБЫТИЯ --</div>
  <div id="top-screen">Загрузка игры...</div>
</div>

<div class="screen-frame">
  <div class="screen-title">-- ЭКРАН 2: УПРАВЛЕНИЕ И ДЕЙСТВИЯ --</div>
  <div id="bottom-screen">Загрузка управления...</div>
</div>

<script>
// Вспомогательные функции
function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function pick(arr) {
  return arr[rand(0, arr.length - 1)];
}
function chance(pct) {
  return Math.random() * 100 < pct;
}

// Данные игры
var MODS = [
  {id:'armor', n:'Броня', d:'урон −30%', q:30},
  {id:'sight', n:'Прицел', d:'+15% точность', q:15},
  {id:'scan', n:'Сканер', d:'скан комнат', q:0},
  {id:'shield', n:'Щит', d:'поглощает урон', q:4},
  {id:'repair', n:'Ремонтник', d:'хил ядра', q:2},
  {id:'grip', n:'Манипулятор', d:'+50% металла', q:50}
];

var ROOM_NAMES = ['Шлюз', 'Склад', 'Реакторная', 'Лаборатория', 'Жилой блок', 'Ангар', 'Мастерская', 'Пультовая', 'Оранжерея'];
var AGES = {
  anc: {n:'Древняя', acc:[40,60], ec:[4,5], mc:[2,3], core:0.8},
  old: {n:'Старая', acc:[60,75], ec:[3,4], mc:[1,2], core:0.9},
  new: {n:'Новая', acc:[75,90], ec:[1,3], mc:[1,1], core:1.0}
};
var POWERS = {
  ok: {n:'норма', res:1, sc:1, bot:0},
  em: {n:'авария', res:0.8, sc:1, bot:7},
  off: {n:'нет тока', res:0.2, sc:0.75, bot:15}
};
var SIZES = {
  s: {n:'Малая', r:[4,5]},
  m: {n:'Средняя', r:[6,7]},
  l: {n:'Большая', r:[8,9]}
};

var G = null;
var activeTab = 'actions';

function currentAge() {
  return (G && G.stations && G.stations[G.st - 1]) ? G.stations[G.st - 1].age : 'old';
}
function currentStation() {
  return G.stations[G.st - 1];
}
function getGain(n) {
  var p = POWERS[currentStation().pw];
  return Math.max(1, Math.round(n * p.res));
}

function createWeapon(maxDmg, age, gen) {
  var ag = AGES[age || currentAge()];
  var t = pick(['e', 'm']);
  return {
    n: pick(['Лазер', 'Рельса', 'Плазма', 'Дробовик', 'Пулемёт', 'Шокер']) + '-' + rand(1,9),
    t: t,
    dmg: rand(3, maxDmg || 9),
    acc: rand(ag.acc[0], ag.acc[1]),
    c: t == 'e' ? rand(ag.ec[0], ag.ec[1]) : rand(ag.mc[0], ag.mc[1]),
    hp: rand(5,12),
    gen: gen || 100
  };
}

function createMod(age, gen) {
  var m = JSON.parse(JSON.stringify(pick(MODS)));
  m.hp = rand(4,10);
  m.gen = gen || 100;
  return m;
}

function generateRooms(count) {
  var rooms = [];
  for(var i = 0; i < count; i++) {
    rooms.push({
      name: i === 0 ? 'Шлюз' : ROOM_NAMES[i % ROOM_NAMES.length],
      adj: [],
      type: i === 0 ? 'x' : (chance(45) ? 'e' : (chance(55) ? 'l' : 'x')),
      vis: i === 0,
      clear: i === 0,
      loot: []
    });
  }
  function link(a, b) {
    if(a !== b && rooms[a].adj.indexOf(b) === -1) {
      rooms[a].adj.push(b);
      rooms[b].adj.push(a);
    }
  }
  for(var i = 1; i < count; i++) {
    link(i, rand(0, i - 1));
  }
  for(var k = 0; k < count / 3; k++) {
    link(rand(0, count - 1), rand(0, count - 1));
  }
  var crusher = rand(1, count - 1);
  rooms[crusher].type = 'g';
  rooms[crusher].name = 'Дробилка';
  
  var labs = rooms.filter(function(x){ return x.type == 'l'; });
  if(labs.length > 0) pick(labs).gE = true;
  return rooms;
}

function pickPower(age) {
  var w = {anc:[15,40], old:[40,40], new:[75,22]}[age];
  var x = rand(1, 100);
  return x <= w[0] ? 'ok' : x <= w[0] + w[1] ? 'em' : 'off';
}

function generateStation(opt) {
  opt = opt || {};
  var sz = opt.sz || pick(['s','m','l']);
  var age = opt.age || pick(['anc','old','new']);
  var pw = opt.pw || pickPower(age);
  var roomCount = rand(SIZES[sz].r[0], SIZES[sz].r[1]);
  return {
    name: pick(['Арес', 'Фобос', 'Деймос', 'Олимп', 'Тарсис', 'Кратер', 'Гелиос', 'Утопия']) + '-' + rand(1,99),
    sz: sz,
    age: age,
    pw: pw,
    rooms: generateRooms(roomCount),
    sent: false
  };
}

function fillMap() {
  var okCount = function() {
    return G.stations.filter(function(s){ return !s.sent && s.pw == 'ok'; }).length;
  };
  while(okCount() < 2) {
    G.stations.push(generateStation({pw:'ok', age:pick(['old','new'])} ));
  }
  while(G.stations.filter(function(s){ return !s.sent; }).length < 4) {
    G.stations.push(generateStation());
  }
}

function newGame() {
  var st0 = generateStation({sz:'s', age:'new', pw:'ok'});
  var weps = [createWeapon(9, 'old', 100)];
  
  G = {
    robot: { gen: 100, hp: 20, max: 20, weps: weps, mods: [createMod('old', 100)] },
    bodies: [],
    en: 60,
    me: 10,
    ant: true,
    st: 1,
    rooms: st0.rooms,
    cur: 0,
    prev: 0,
    fight: null,
    tg: 'c',
    sh: 0,
    log: ['Старт на Марсе. Станция «' + st0.name + '».'],
    over: null,
    surf: false,
    sent: 0,
    stations: [st0]
  };
  fillMap();
  render();
}

function logMsg(msg) {
  G.log.push(msg);
  if(G.log.length > 5) G.log.shift();
}

function hasMod(id) {
  return G.robot.mods.some(function(m){ return m.id == id; });
}

function goRoom(i) {
  if(G.en <= 0) return gameOver('Энергия исчерпана.');
  G.en--;
  G.prev = G.cur;
  G.cur = i;
  var r = G.rooms[i];
  r.vis = true;
  
  if(hasMod('repair') && G.robot.hp < G.robot.max) {
    G.robot.hp = Math.min(G.robot.max, G.robot.hp + 2);
  }
  
  if(!r.clear) {
    if(r.type == 'e') {
      startFight(r);
      return;
    }
    r.clear = true;
    if(r.type == 'l') {
      var metal = getGain(rand(3, 8));
      if(hasMod('grip')) metal = Math.round(metal * 1.5);
      G.me += metal;
      logMsg('Обыск «' + r.name + '»: +' + metal + ' металла');
    } else {
      logMsg('Комната «' + r.name + '» пуста.');
    }
  } else {
    logMsg('Вы в комнате «' + r.name + '».');
  }
  render();
}

function startFight(r) {
  var enemy = {
    n: pick(['Дрон', 'Шагоход', 'Патруль', 'Страж']) + '-' + rand(10,99),
    core: Math.round(rand(16, 25) * AGES[currentAge()].core),
    sh: 0,
    parts: []
  };
  enemy.max = enemy.core;
  var w = createWeapon(7, undefined, 100);
  enemy.parts.push({ t:'w', v:w, hp:w.hp, max:w.hp });
  
  G.fight = { e: enemy, r: r };
  G.tg = 'c';
  logMsg('Бой! Противник: ' + enemy.n);
  render();
}

function getHitChance(w) {
  var acc = w.acc + (hasMod('sight') ? 15 : 0);
  if(G.tg != 'c') acc -= 10;
  return Math.max(10, Math.min(95, acc));
}

function canFire(w) {
  if(w.t == 'e') return G.en >= w.c;
  if(w.t == 'm') return G.me >= w.c;
  return true;
}

function shoot(wIndex) {
  var w = (wIndex === -1) ? {n:'Удар', t:'-', dmg:2, acc:75, c:0} : G.robot.weps[wIndex];
  var e = G.fight.e;
  
  if(!canFire(w)) {
    logMsg('Не хватает ресурсов для выстрела!');
    render();
    return;
  }
  
  if(w.t == 'e') G.en -= w.c;
  else if(w.t == 'm') G.me -= w.c;
  
  if(chance(getHitChance(w))) {
    if(G.tg == 'c') {
      var dmg = w.dmg;
      if(e.sh > 0) {
        var absorbed = Math.min(e.sh, dmg);
        e.sh -= absorbed;
        dmg -= absorbed;
      }
      e.core -= dmg;
      logMsg('Попадание в ядро врага: −' + dmg);
    } else {
      var p = e.parts[0];
      p.hp -= w.dmg;
      if(p.hp <= 0) {
        p.dead = true;
        logMsg('Деталь врага уничтожена!');
        G.tg = 'c';
      } else {
        logMsg('Урон по детали: −' + w.dmg);
      }
    }
  } else {
    logMsg('Промах!');
  }
  
  if(e.core <= 0) {
    winFight();
  } else {
    enemyTurn();
  }
}

function enemyTurn() {
  var e = G.fight.e;
  if(chance(60)) {
    var dmg = rand(2, 5);
    if(G.sh > 0) {
      var abs = Math.min(G.sh, dmg);
      G.sh -= abs;
      dmg -= abs;
    }
    G.robot.hp -= dmg;
    logMsg('Враг атакует: −' + dmg + ' HP');
  } else {
    logMsg('Враг промахнулся.');
  }
  
  if(G.robot.hp <= 0) {
    gameOver('Ядро робота уничтожено.');
  } else {
    render();
  }
}

function winFight() {
  var r = G.fight.r;
  G.fight = null;
  r.clear = true;
  var metal = getGain(rand(4, 10));
  G.me += metal;
  logMsg('Победа! Получено металла: +' + metal);
  render();
}

function fleeFight() {
  if(chance(50)) {
    G.cur = G.prev;
    G.fight = null;
    logMsg('Успешный отход!');
    render();
  } else {
    logMsg('Не удалось отступить!');
    enemyTurn();
  }
}

function repairAntenna() {
  if(G.me >= 12) {
    G.me -= 12;
    G.ant = true;
    logMsg('Антенна восстановлена.');
    render();
  }
}

function openSurface() {
  if(G.en < 10) return;
  G.en -= 10;
  G.fight = null;
  G.surf = true;
  logMsg('Выход на поверхность.');
  render();
}

function driveStation(index) {
  G.surf = false;
  G.st = index + 1;
  var st = G.stations[index];
  G.rooms = st.rooms;
  G.cur = 0;
  logMsg('Перелет на станцию №' + G.st);
  render();
}

function sendData() {
  var st = currentStation();
  st.sent = true;
  G.sent++;
  fillMap();
  logMsg('Данные успешно переданы на Землю!');
  render();
}

function gameOver(reason) {
  G.over = reason;
  render();
}

// Отрисовка интерфейса для 2DS (Чистые таблицы и блоки)
function render() {
  var top = document.getElementById('top-screen');
  var bot = document.getElementById('bottom-screen');
  
  if(G.over) {
    top.innerHTML = '<b>КОНЕЦ ИГРЫ</b><br><span class="red">' + G.over + '</span>';
    bot.innerHTML = '<button onclick="newGame()">Начать заново</button>';
    return;
  }
  
  if(G.surf) {
    var tHTML = '<b>ПОВЕРХНОСТЬ МАРСА</b><br>';
    tHTML += 'Энергия: ' + G.en + ' | Металл: ' + G.me + '<br>';
    tHTML += 'Передано станций: ' + G.sent;
    top.innerHTML = tHTML;
    
    var bHTML = '<b>Доступные станции:</b><br>';
    for(var k = 0; k < G.stations.length; k++) {
      var s = G.stations[k];
      bHTML += '<div class="panel">';
      bHTML += '<b>#' + (k+1) + ' «' + s.name + '»</b>' + (s.sent ? ' [Передано]' : '') + '<br>';
      bHTML += '<button onclick="driveStation(' + k + ')">' + ((k+1) == G.st ? 'Вернуться' : 'Лететь') + '</button>';
      bHTML += '</div>';
    }
    bot.innerHTML = bHTML;
    return;
  }
  
  var rs = G.rooms;
  var r = rs[G.cur];
  var doneCount = rs.filter(function(x){ return x.clear; }).length;
  
  // Верхний экран: статус + текущая комната / бой + лог
  var topHTML = '<table class="stats"><tr>' +
    '<td><b>' + G.robot.hp + '/' + G.robot.max + '</b>ЯДРО</td>' +
    '<td><b>' + G.en + '</b>ЭНЕРГИЯ</td>' +
    '<td><b>' + G.me + '</b>МЕТАЛЛ</td>' +
    '<td><b class="' + (G.ant ? 'green' : 'red') + '">' + (G.ant ? 'ОК' : 'НЕТ') + '</b>АНТЕННА</td>' +
    '</tr></table>';
    
  topHTML += '<div class="panel">';
  if(G.fight) {
    topHTML += '<span class="red"><b>БОЙ: ' + G.fight.e.n + '</b></span><br>';
    topHTML += 'Ядро врага: ' + G.fight.e.core + '/' + G.fight.e.max;
  } else {
    topHTML += 'Станция #' + G.st + ' | Комната: <b>' + r.name + '</b><br>';
    topHTML += 'Исследовано: ' + doneCount + '/' + rs.length;
  }
  topHTML += '</div>';
  
  topHTML += '<div class="log-box">';
  for(var l = 0; l < G.log.length; l++) {
    topHTML += '<div>&gt; ' + G.log[l] + '</div>';
  }
  topHTML += '</div>';
  top.innerHTML = topHTML;
  
  // Нижний экран: вкладки и интерактив
  var botHTML = '<div style="margin-bottom:4px;">';
  botHTML += '<button class="' + (activeTab == 'act' ? 'active' : '') + '" onclick="activeTab=\'act\';render()">Действия</button>';
  botHTML += '<button class="' + (activeTab == 'inv' ? 'active' : '') + '" onclick="activeTab=\'inv\';render()">Инвентарь</button>';
  botHTML += '<button class="' + (activeTab == 'map' ? 'active' : '') + '" onclick="activeTab=\'map\';render()">Карта</button>';
  botHTML += '</div>';
  
  botHTML += '<div class="panel" style="min-height:90px;">';
  if(G.fight) {
    botHTML += '<b>Выберите атаку:</b><br>';
    botHTML += '<button onclick="shoot(-1)">Удар (2 урона)</button><br>';
    for(var wi = 0; wi < G.robot.weps.length; wi++) {
      var wep = G.robot.weps[wi];
      botHTML += '<button onclick="shoot(' + wi + ')" ' + (canFire(wep) ? '' : 'disabled') + '>' + wep.n + ' (' + getHitChance(wep) + '%)</button><br>';
    }
    botHTML += '<button onclick="fleeFight()">Отступить</button>';
  } else if(activeTab == 'act') {
    var canSend = (doneCount == rs.length && G.ant && !currentStation().sent);
    botHTML += '<button class="' + (canSend ? 'active' : '') + '" onclick="sendData()" ' + (canSend ? '' : 'disabled') + '>Передать данные</button><br>';
    if(!G.ant) {
      botHTML += '<button onclick="repairAntenna()">Починить антенну (12 мет.)</button><br>';
    }
    if(G.cur === 0) {
      botHTML += '<button onclick="openSurface()">На поверхность (10 энерг.)</button>';
    }
  } else if(activeTab == 'inv') {
    botHTML += '<b>Оружие:</b><br>';
    for(var wj = 0; wj < G.robot.weps.length; wj++) {
      botHTML += '- ' + G.robot.weps[wj].n + ' (ур. ' + G.robot.weps[wj].dmg + ')<br>';
    }
    botHTML += '<b>Модули:</b><br>';
    for(var mj = 0; mj < G.robot.mods.length; mj++) {
      botHTML += '- ' + G.robot.mods[mj].n + '<br>';
    }
  } else if(activeTab == 'map') {
    botHTML += '<b>Соседние комнаты:</b><br>';
    for(var aj = 0; aj < r.adj.length; aj++) {
      var nextIdx = r.adj[aj];
      var nr = rs[nextIdx];
      var icon = nr.vis ? (nr.clear ? '[✓]' : '[⚔]') : '[?]';
      botHTML += '<button onclick="goRoom(' + nextIdx + ')">' + nr.name + ' ' + icon + '</button><br>';
    }
  }
  botHTML += '</div>';
  bot.innerHTML = botHTML;
}

// Запуск игры при загрузке страницы
window.onload = function() {
  newGame();
};
</script>

</body>
</html>
