<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Марс: заброшенные станции (2DS Retro Edition)</title>
<style>
/* 
  Retro Compatible CSS for Nintendo 2DS Browser (NetFront / Old WebKit)
  No CSS variables, no env(), strict block/table sizing for guaranteed rendering.
*/
body {
  margin: 0;
  padding: 2px;
  background-color: #030805;
  color: #b8f2c8;
  font-family: monospace;
  font-size: 11px;
  line-height: 1.2;
}
.ds-container {
  width: 310px;
  margin: 0 auto;
}
.ds-screen {
  background-color: #07120a;
  border: 2px solid #133822;
  border-radius: 4px;
  padding: 4px;
  margin-bottom: 4px;
}
.ds-top {
  border-bottom: 3px dashed #133822;
  min-height: 190px;
}
.ds-bottom {
  min-height: 195px;
}
.screen-label {
  font-size: 9px;
  text-transform: uppercase;
  color: #578a69;
  border-bottom: 1px solid #133822;
  padding-bottom: 2px;
  margin-bottom: 3px;
}
.st-table {
  width: 100%;
  border-collapse: collapse;
  background-color: #0c2417;
  border: 1px solid #133822;
  text-align: center;
  margin-bottom: 3px;
}
.st-table td {
  padding: 3px;
  border: 1px solid #133822;
}
.st-table b {
  font-size: 12px;
  color: #2fe06a;
  display: block;
}
.st-table span {
  font-size: 9px;
  color: #578a69;
}
button {
  font-family: monospace;
  color: #b8f2c8;
  background-color: #0c2417;
  border: 1px solid #133822;
  border-radius: 4px;
  padding: 4px 6px;
  margin: 2px;
  cursor: pointer;
  font-size: 10px;
}
button.p {
  background-color: #2fe06a;
  color: #03140a;
  font-weight: bold;
}
button.sel {
  border: 2px solid #2fe06a;
  background-color: #113822;
}
.card {
  background-color: #050e08;
  border: 1px solid #133822;
  padding: 4px;
  margin-bottom: 3px;
}
.mu { color: #578a69; font-size: 10px; }
.bad { color: #ff5252; }
.ok { color: #2fe06a; }
.log-box {
  font-size: 9px;
  color: #578a69;
  background-color: #020503;
  padding: 3px;
  border: 1px solid #0d2215;
  height: 45px;
  overflow: hidden;
}
.log-box div { margin-bottom: 1px; }
.tabs {
  text-align: center;
  margin-bottom: 4px;
}
.tabs button {
  width: 31%;
  padding: 3px 2px;
  font-size: 9px;
}
.content-box {
  max-height: 145px;
  overflow-y: auto;
}
</style>
</head>
<body>
<div class="ds-container">
  <!-- Верхний экран 2DS -->
  <div class="ds-screen ds-top">
    <div class="screen-label">Экран 1: Телеметрия и Бой</div>
    <div id="top-screen"></div>
  </div>

  <!-- Нижний экран 2DS -->
  <div class="ds-screen ds-bottom">
    <div class="screen-label">Экран 2: Управление и Инвентарь</div>
    <div id="bottom-screen"></div>
  </div>
</div>

<script>
// Стабильный ES5/ES6 игровой движок
var R = function(a,b){ return a + Math.floor(Math.random()*(b-a+1)); };
var P = function(a){ return a[R(0, a.length-1)]; };
var ch = function(p){ return Math.random()*100 < p; };

var MODS = [
  {id:'armor',n:'Броня',d:'урон по ядру −30%',e:1},
  {id:'sight',n:'Прицел',d:'+15% точность',e:1},
  {id:'scan',n:'Сканер',d:'показывает комнаты',e:1},
  {id:'shield',n:'Щит',d:'поглощает 3 урона',e:2},
  {id:'repair',n:'Ремонтник',d:'+2 ядро при переходе',e:2},
  {id:'grip',n:'Манипулятор',d:'+50% металла',e:1},
  {id:'regen',n:'Реген',d:'',e:1},{id:'cloak',n:'Невидимка',d:'',e:1},{id:'solar',n:'Панели',d:'',e:0}
];
var RN = ['Шлюз','Склад','Реакторная','Лаборатория','Жилой блок','Ангар','Мастерская','Пультовая','Оранжерея'];
var AGES = {
  anc:{n:'Древняя',acc:[40,60],ec:[4,5],mc:[2,3],core:.8},
  old:{n:'Старая',acc:[60,75],ec:[3,4],mc:[1,2],core:.9},
  new:{n:'Новая',acc:[75,90],ec:[1,3],mc:[1,1],core:1}
};
var PW = {
  ok:{n:'норма',res:1,sc:1,bot:0},
  em:{n:'авария',res:.8,sc:1,bot:7},
  off:{n:'нет тока',res:.2,sc:.75,bot:15}
};
var SZ = {s:{n:'Малая',r:[4,5]},m:{n:'Средняя',r:[6,7]},l:{n:'Большая',r:[8,9]}};

var curAge = function(){ return G && G.sts && G.sts[G.st-1] ? G.sts[G.st-1].age : 'old'; };
var cs = function(){ return G.sts[G.st-1]; };
var gain = function(n){ var p = PW[cs().pw]; return Math.max(1, Math.round(n * (act('scan') ? p.sc : p.res))); };

var newW = function(mx, ag, gen){
  var A = AGES[ag || curAge()], t = P(['e','m']), dmg = R(3, mx || 9);
  return {
    n: P(['Лазер','Рельса','Плазма','Дробовик','Пулемёт','Шокер','Игломёт']) + '-' + R(1,9),
    t: t, dmg: dmg, acc: R(A.acc[0], A.acc[1]),
    c: t == 'e' ? R(A.ec[0], A.ec[1]) : R(A.mc[0], A.mc[1]),
    hp: R(5,12), gen: gen || lootGen()
  };
};

var newM = function(ag, gen){
  var m = JSON.parse(JSON.stringify(P(MODS)));
  m.e = m.id == 'solar' ? 0 : Math.max(1, m.e + R(-1,1));
  var ageObj = AGES[ag || curAge()];
  m.p = R(ageObj.acc[0], ageObj.acc[1]);
  m.hp = R(4,10); m.on = true; m.left = 0; m.t = R(2,5); m.cd = 0; m.gen = gen || lootGen();
  if(m.id == 'regen'){ m.a = R(2,6); m.e = 0; }
  if(m.id == 'cloak'){ m.e = R(3,8); m.q = R(15,40); m.b = R(10,35); }
  if(m.id == 'armor') m.q = R(15,45);
  if(m.id == 'shield') m.q = R(2,6);
  if(m.id == 'repair') m.m = R(2,5);
  if(m.id == 'solar') m.s = R(8,20);
  return m;
};

var md = function(m){
  var map = {
    armor:'урон −'+m.q+'%', sight:'+15% точн.', scan:'скан комнат',
    shield:'щит '+m.q, repair:'хил ядра', grip:'+50% метал',
    regen:'+'+m.a+'⚡/ход', cloak:'невидимка', solar:'+'+m.s+'⚡ сол.'
  };
  return map[m.id] || m.n;
};

var GEN = {
  100:{w:1,m:2,hp:20,cost:10},
  200:{w:1,m:2,hp:25,cost:20},
  300:{w:2,m:3,hp:30,cost:30},
  400:{w:2,m:3,hp:35,cost:40},
  500:{w:2,m:4,hp:40,cost:50}
};
var gn = function(g){ return 'X-' + g; };
var pickGen = function(){
  var x = R(1,100), list = [[100,30],[200,28],[300,20],[400,14],[500,8]], i, w;
  for(i=0; i<list.length; i++){ w=list[i]; if(x <= w[1]) return w[0]; x -= w[1]; }
  return 100;
};
var lootGen = function(){ return (ch(50) && G && G.robot) ? G.robot.gen : pickGen(); };
var PUNCH = {n:'Удар', t:'-', dmg:2, acc:75, c:0};

var G;
var activeTab = 'actions';

function genRooms(n){
  var rooms = [], i, k;
  for(i=0; i<n; i++){
    rooms.push({name: i ? RN[i%RN.length]+(i>8?' '+i:''):'Шлюз', adj:[], type: i?(ch(45)?'e':ch(55)?'l':'x'):'x', vis:!i, clear:!i, loot:[]});
  }
  var link = function(a,b){ if(a!==b && rooms[a].adj.indexOf(b)===-1){ rooms[a].adj.push(b); rooms[b].adj.push(a); } };
  for(i=1; i<n; i++) link(i, R(0, i-1));
  for(k=0; k<n/3; k++) link(R(0, n-1), R(0, n-1));
  var g = R(1, n-1); rooms[g].type = 'g'; rooms[g].name = 'Дробилка';
  if(!rooms.some(function(x){return x.type=='l';})){
    var c = []; rooms.forEach(function(x,idx){if(idx && x.type!='g') c.push(idx);});
    rooms[P(c)].type = 'l';
  }
  var lRooms = rooms.filter(function(x){return x.type=='l';});
  if(lRooms.length > 0) P(lRooms).gE = true;
  return rooms;
}

var pickPw = function(a){
  var w = {anc:[15,40], old:[40,40], new:[75,22]}[a], x = R(1,100);
  return x <= w[0] ? 'ok' : x <= w[0]+w[1] ? 'em' : 'off';
};

function genStation(o){
  o = o || {};
  var sz = o.sz || P(['s','m','l']), age = o.age || P(['anc','old','new']), pw = o.pw || pickPw(age);
  return {
    name: P(['Арес','Фобос','Деймос','Олимп','Тарсис','Меридиан','Кратер','Гелиос','Утопия','Эллада']) + '-' + R(1,99),
    sz: sz, age: age, pw: pw, rooms: genRooms(R(SZ[sz].r[0], SZ[sz].r[1])), sent: false
  };
}

function fillMap(){
  var okN = function(){ return G.sts.filter(function(x){return !x.sent && x.pw=='ok';}).length; };
  while(okN() < 2) G.sts.push(genStation({pw:'ok', age:P(['old','new'])}));
  while(G.sts.filter(function(x){return !x.sent;}).length < 4) G.sts.push(genStation());
}

var stTag = function(s){ return SZ[s.sz].n+' ('+s.rooms.length+'к.) · '+AGES[s.age].n+' · '+PW[s.pw].n; };
var bodiesAt = function(k){ return G.bodies.filter(function(b){return b.station===k;}).length; };
var mapCard = function(s,k){
  return '<div class="card"><b>№'+(k+1)+' «'+s.name+'»</b>'+(k+1==G.st?' <span class="ok">текущ.</span>':'')+(s.sent?' <span class="ok">✓</span>':'')+
         '<br><span class="mu">'+stTag(s)+'</span>'+(bodiesAt(k)?'<br><span class="mu">Тел: '+bodiesAt(k)+'</span>':'')+
         '<br><button class="p" onclick="drive('+k+')">'+(k+1==G.st?'Вернуться':'Лететь')+'</button></div>';
};

function newGame(){
  var st0 = genStation({sz:'s', age:'new', pw:'ok'}), rooms = st0.rooms, n = rooms.length;
  var gen = pickGen(), gi = GEN[gen], weps = [newW(9, 'old', gen)];
  if(gi.w > 1 && ch(50)) weps.push(newW(9, 'old', gen));
  
  G = {
    robot: {gen:gen, hp:gi.hp, max:gi.hp, weps:weps, mods:[newM('old',gen), newM('old',gen)]},
    bodies: [],
    get hp(){ return this.robot.hp; }, set hp(v){ this.robot.hp = v; },
    get max(){ return this.robot.max; }, set max(v){ this.robot.max = v; },
    get weps(){ return this.robot.weps; },
    get mods(){ return this.robot.mods; },
    en: 60, me: 10, ant: true, st: 1, rooms: rooms, cur: 0, prev: 0, fight: null, tg: 'c', sh: 0,
    log: ['Старт на Марсе в теле '+gn(gen)+'. Станция «'+st0.name+'»: '+n+' комнат.'], over: null
  };
  G.sts = [st0]; G.sent = 0; fillMap();
  render();
}

var L = function(s){ G.log.push(s); };
var act = function(id){ return G.mods.some(function(m){return m.id==id && m.left>0;}); };
var tick = function(){
  G.mods.forEach(function(m){
    if(m.id=='regen'){
      if(m.left>0){ G.en += m.a; m.left--; if(!m.left) m.cd = 3; }
      else if(m.cd>0) m.cd--;
      else if(ch(m.p)) m.left = m.t;
    } else if(m.left>0) m.left--;
  });
};
var cloakQ = function(){ var c = G.mods.filter(function(m){return m.id=='cloak' && m.left>0;})[0]; return c ? c.q : 0; };
var cond = function(f){ return f > .66 ? 'цел' : f > .33 ? 'поврежден' : 'критично'; };
var spend = function(n){ G.en = Math.max(0, G.en - n); };
var stIcon = function(r){ return r.vis ? (r.clear ? '✓' : '⚔') : (act('scan') ? {e:'враг', l:'лут', x:'пусто', g:'дроб'}[r.type] : '?'); };

function go(i){
  if(G.en <= 0) return lose('Энергия на нуле.');
  spend(1); tick(); G.rep = null; G.prev = G.cur; G.cur = i;
  var r = G.rooms[i]; r.vis = true;
  if(act('repair') && G.hp < G.max) G.hp = Math.min(G.max, G.hp + 2);
  if(!r.clear){
    if(r.type == 'e') return startFight(r);
    r.clear = true;
    if(r.type == 'l'){
      var m = R(3,8); if(act('grip')) m = Math.round(m * 1.5); m = gain(m); G.me += m;
      L('Обыск «'+r.name+'»: +'+m+'🔩');
    } else {
      L(r.type == 'g' ? 'Дробилка найдена.' : '«'+r.name+'»: пусто.');
    }
  } else {
    L('Вы в комнате «'+r.name+'».');
  }
  if(G.en <= 0) L('Энергия на нуле!');
  render();
}

function startFight(r){
  var e = {
    n: P(['Дрон','Шагоход','Патруль','Сборщик','Страж'])+'-'+R(10,99),
    core: Math.round(R(16,30) * AGES[curAge()].core),
    fx:{}, sh:0, en:R(6,20), me:R(3,10), parts:[], gen:pickGen()
  };
  e.max = e.core;
  var w = newW(7, undefined, e.gen); e.parts.push({t:'w', v:w, hp:w.hp, max:w.hp});
  G.fight = {e:e, r:r}; G.tg = 'c';
  L('Бой! Враг: '+e.n);
  render();
}

var chance = function(w){ return Math.max(5, Math.min(95, w.acc + (act('sight')?15:0) - (G.tg!='c'?10:0))); };
var canFire = function(w){ return w.t=='e' ? G.en >= w.c : w.t=='m' ? G.me >= w.c : true; };

function shoot(w){
  var e = G.fight.e;
  if(!canFire(w)) return;
  if(w.t=='e') spend(w.c); else if(w.t=='m') G.me -= w.c;
  
  if(ch(chance(w))){
    if(G.tg == 'c'){
      var d = w.dmg;
      if(e.sh > 0){ var a = Math.min(e.sh, d); e.sh -= a; d -= a; }
      e.core -= d; L('Ядро врага: −'+d);
    } else {
      var p = e.parts[G.tg]; p.hp -= w.dmg;
      if(p.hp <= 0){ p.dead = true; L('Деталь выбита!'); G.tg = 'c'; }
      else { L('Урон по детали: −'+w.dmg); }
    }
  } else { L('Промах!'); }
  
  if(e.core <= 0) return win();
  round();
}

function round(){
  var e = G.fight.e, wp = e.parts[0], w = wp.dead ? {dmg:1, acc:50} : wp.v;
  if(ch(Math.max(5, w.acc - cloakQ() - PW[cs().pw].bot))){
    var d = w.dmg;
    if(G.sh > 0){ var a = Math.min(G.sh, d); G.sh -= a; d -= a; }
    G.hp -= d; L('Враг попал: −'+d+' HP');
  } else { L('Враг промахнулся.'); }
  if(G.hp <= 0) return lose('Ядро уничтожено.');
  tick(); render();
}

function win(){
  var r = G.fight.r; G.fight = null; r.clear = true;
  var m = gain(R(4,10)); G.me += m;
  L('Победа! +'+m+'🔩'); render();
}
function flee(){ if(ch(50)){ G.cur = G.prev; G.fight = null; L('Отступили.'); render(); } else { L('Не удалось отступить.'); round(); } }
function lose(s){ G.over = s; G.fight = null; render(); }
function take(i){
  var r = G.rooms[G.cur], it = r.loot[i], ro = G.robot;
  if(it.k == 'w') G.weps.push(it.v); else if(it.k == 'm') G.mods.push(it.v);
  r.loot.splice(i,1); render();
}
function repair(){ if(G.me >= 12){ G.me -= 12; G.ant = true; L('Антенна починена.'); render(); } }
function sun(i){ var m = G.mods[i]; if(m.used) return; m.used = true; G.en += m.s; L('Панели: +'+m.s+'⚡'); render(); }
function surf(){ if(G.en < 10) return; spend(10); G.fight = null; G.surf = true; render(); }
function drive(k){ G.surf = false; G.st = k+1; var s = G.sts[k]; G.rooms = s.rooms; G.cur = 0; L('Станция №'+G.st); render(); }
function send(){ var s = G.sts[G.st-1]; s.sent = true; G.sent++; fillMap(); L('Данные отправлены!'); render(); }

// Рендеринг для 2DS (Без flex/grid, чистые таблицы и блочные элементы)
function render(){
  var top = document.getElementById('top-screen');
  var bot = document.getElementById('bottom-screen');
  
  if(G.over){
    top.innerHTML = '<h3>КОНЕЦ ИГРЫ</h3><p>'+G.over+'</p>';
    bot.innerHTML = '<button class="p" onclick="newGame()">Заново</button>';
    return;
  }
  
  if(G.surf){
    top.innerHTML = '<h3>Поверхность Марса</h3><p>⚡'+G.en+' | 🔩'+G.me+' | Передано: '+G.sent+'</p>';
    var bH = '<div class="content-box"><h3>Станции</h3>';
    bH += G.sts.map(function(s,k){ return mapCard(s,k); }).join('');
    bH += '</div>';
    bot.innerHTML = bH;
    return;
  }
  
  var rs = G.rooms, r = rs[G.cur], done = rs.filter(function(x){return x.clear;}).length, F = G.fight;
  
  // Верхний экран: Статус + Бой или Комната
  var tH = '<table class="st-table"><tr>'+
           '<td><b>'+G.hp+'/'+G.max+'</b><span>ЯДРО</span></td>'+
           '<td><b>'+G.en+'</b><span>ЭНЕРГ</span></td>'+
           '<td><b>'+G.me+'</b><span>МЕТАЛ</span></td>'+
           '<td><b class="'+(G.ant?'ok':'bad')+'">'+(G.ant?'ОК':'НЕТ')+'</b><span>АНТЕННА</span></td>'+
           '</tr></table>';
           
  tH += '<div class="card"><b>Станция №'+G.st+'</b>: «'+r.name+'» ('+done+'/'+rs.length+' изсл.)';
  if(F){
    tH += '<br><span class="bad"><b>БОЙ: '+F.e.n+'</b> (Ядро: '+F.e.core+'/'+F.e.max+')</span>';
  } else {
    tH += '<br><span class="mu">'+stTag(cs())+'</span>';
  }
  tH += '</div>';
  tH += '<div class="log-box">'+G.log.slice(-3).map(function(s){return '<div>'+s+'</div>';}).join('')+'</div>';
  top.innerHTML = tH;
  
  // Нижний экран: Вкладки и Управление
  var bH = '<div class="tabs">'+
           '<button class="'+(activeTab=='actions'?'sel':'')+'" onclick="activeTab=\'actions\';render()">Действия</button>'+
           '<button class="'+(activeTab=='inv'?'sel':'')+'" onclick="activeTab=\'inv\';render()">Инвентарь</button>'+
           '<button class="'+(activeTab=='map'?'sel':'')+'" onclick="activeTab=\'map\';render()">Выходы</button>'+
           '</div>';
           
  bH += '<div class="content-box">';
  if(F){
    bH += '<div class="card"><b>Атака:</b><br>';
    bH += '<button class="'+(G.tg=='c'?'sel':'')+'" onclick="G.tg=\'c\';render()">Ядро</button>';
    bH += '<br><b>Оружие:</b><br>';
    G.weps.concat([PUNCH]).forEach(function(w,i){
      bH += '<button class="p" '+(canFire(w)?'':'disabled')+' onclick="shoot('+(i<G.weps.length?'G.weps['+i+']':'PUNCH')+')">'+w.n+' ('+chance(w)+'%)</button>';
    });
    bH += '<br><button onclick="flee()">Отступить</button></div>';
  } else if(activeTab == 'actions'){
    bH += '<div class="card"><b>Комната:</b>';
    if(r.loot.length){
      r.loot.forEach(function(it,i){
        bH += '<br>Находка <button onclick="take('+i+')">Взять</button>';
      });
    }
    bH += '<br><button class="p" onclick="send()" '+(done==rs.length&&G.ant&&!cs().sent?'':'disabled')+'>Передать данные</button>';
    if(!G.ant) bH += '<br><button onclick="repair()">Починить антенну (12🔩)</button>';
    if(G.cur == 0) bH += '<br><button onclick="surf()">На поверхность (10⚡)</button>';
    bH += '</div>';
  } else if(activeTab == 'inv'){
    bH += '<div class="card"><b>Оружие и Модули:</b>';
    G.weps.forEach(function(w){ bH += '<br>🔫 '+w.n+' ('+w.dmg+' урона)'; });
    G.mods.forEach(function(m){ bH += '<br>⚙ '+m.n; });
    bH += '</div>';
  } else if(activeTab == 'map'){
    bH += '<div class="card"><b>Переходы:</b><br>';
    r.adj.forEach(function(i){
      var x = rs[i];
      bH += '<button class="p" onclick="go('+i+')">'+x.name+' ['+stIcon(x)+']</button> ';
    });
    bH += '</div>';
  }
  bH += '</div>';
  bot.innerHTML = bH;
}

newGame();
</script>
</body>
