<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Марс: заброшенные станции</title>
<style>
body { margin: 0; background: #050b07; color: #c9f5d6; font-family: monospace; font-size: 13px; padding: 6px; }
.card { background: #0b1710; border: 1px solid #17402a; border-radius: 8px; padding: 8px; margin-bottom: 6px; }
h3 { margin: 0 0 4px; font-size: 13px; color: #6fa381; text-transform: uppercase; }
button { font: inherit; color: #c9f5d6; background: #10241a; border: 1px solid #17402a; border-radius: 6px; padding: 6px 8px; margin: 2px; cursor: pointer; }
button.p { background: #2fe06a; color: #03140a; border-color: #2fe06a; }
.log { font-size: 12px; color: #6fa381; }
.bad { color: #ff5a5a; }
.ok { color: #2fe06a; }
.mu { color: #6fa381; font-size: 12px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
// Игровые данные
var G = {
    hp: 20, max: 20,
    en: 60, me: 15,
    st: 1,
    cur: 0,
    rooms: [
        { name: 'Шлюз', adj: [1, 2], clear: true },
        { name: 'Склад', adj: [0], clear: false },
        { name: 'Реакторная', adj: [0], clear: false }
    ],
    sts: [
        { name: 'Арес-1', sent: false },
        { name: 'Фобос-2', sent: false },
        { name: 'Деймос-3', sent: false }
    ],
    surf: false,
    log: ['Система активирована на Марсе. Добро пожаловать!']
}

function logMsg(txt) {
    G.log.push(txt);
    if (G.log.length > 5) G.log.shift();
}

function go(idx) {
    G.cur = idx;
    var r = G.rooms[idx];
    if (!r.clear) {
        r.clear = true;
        G.me += 5;
        logMsg('Отсек «' + r.name + '» зачищен: +5 металла.');
    } else {
        logMsg('Вы перешли в «' + r.name + '».');
    }
    render();
}

function surf() {
    G.surf = true;
    render();
}

function backToBase() {
    G.surf = false;
    render();
}

function render() {
    var html = '';

    // Статус
    html += '<div class="card">';
    html += 'Ядро: <b>' + G.hp + '/' + G.max + '</b> | ⚡: <b>' + G.en + '</b> | 🔩: <b>' + G.me + '</b>';
    html += '</div>';

    if (G.surf) {
        // Меню поверхностей (выбор станций)
        html += '<div class="card">';
        html += '<h3>Поверхность Марса</h3>';
        html += '<div class="mu">Выберите базу для полета:</div>';
        for (var i = 0; i < G.sts.length; i++) {
            html += '<div style="margin-top:6px;"><b>' + G.sts[i].name + '</b><br>';
            html += '<button class="p" onclick="backToBase()">Лететь сюда</button></div>';
        }
        html += '<div style="margin-top:8px;"><button onclick="backToBase()">Назад на базу</button></div>';
        html += '</div>';
    } else {
        // Комнаты станции
        var room = G.rooms[G.cur];
        html += '<div class="card">';
        html += '<h3>Станция №' + G.st + ' · ' + room.name + '</h3>';
        html += '<div class="mu">Доступные отсеки:</div>';

        for (var j = 0; j < room.adj.length; j++) {
            var nextIdx = room.adj[j];
            var nextRoom = G.rooms[nextIdx];
            html += '<button onclick="go(' + nextIdx + ')">' + nextRoom.name + (nextRoom.clear ? ' (✓)' : ' (⚔)') + '</button>';
        }

        html += '<div style="margin-top:8px; border-top:1px solid #17402a; padding-top:6px;">';
        html += '<button onclick="surf()">Выйти на поверхность</button>';
        html += '</div>';
        html += '</div>';
    }

    // Журнал
    html += '<div class="card log"><h3>Журнал</h3>';
    for (var l = 0; l < G.log.length; l++) {
        html += '<div>' + G.log[l] + '</div>';
    }
    html += '</div>';

    document.getElementById('app').innerHTML = html;
}

// Запуск сразу без ожидания onload
render();
</script>

</body>
</html>
