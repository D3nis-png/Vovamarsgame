<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Марс: заброшенные станции</title>
<style>
body { margin: 0; background: #050b07; color: #c9f5d6; font-family: monospace; font-size: 14px; line-height: 1.45; }
#app { max-width: 520px; margin: 0 auto; padding: 10px; }
.card { background: #0b1710; border: 1px solid #17402a; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
h3 { margin: 0 0 6px; font-size: 14px; color: #6fa381; text-transform: uppercase; letter-spacing: .05em; }
.st { width: 100%; text-align: center; border-collapse: collapse; margin-bottom: 6px; }
.st td { width: 25%; padding: 2px; }
.st b { display: block; font-size: 18px; }
.st span { font-size: 11px; color: #6fa381; }
button { font-family: monospace; color: #c9f5d6; background: #10241a; border: 1px solid #17402a; border-radius: 10px; padding: 9px 10px; margin: 3px 3px 3px 0; cursor: pointer; }
button:disabled { opacity: .4; }
button.p { background: #2fe06a; color: #03140a; border-color: #2fe06a; }
button.sel { outline: 2px solid #2fe06a; }
.log { font-size: 13px; color: #6fa381; }
.bad { color: #ff5a5a; }
.ok { color: #2fe06a; }
.mu { color: #6fa381; font-size: 13px; }
</style>
</head>
<body>
<div id="app">Загрузка игры...</div>

<script>
// Вспомогательные функции ES5 (без стрелочных функций и современных методов)
function R(a, b) {
    return a + Math.floor(Math.random() * (b - a + 1));
}
function P(arr) {
    return arr[R(0, arr.length - 1)];
}
function ch(p) {
    return Math.random() * 100 < p;
}

// Данные модулей и константы
var MODS = [
    {id:'armor', n:'Броня', d:'урон по ядру −30%', e:1},
    {id:'sight', n:'Прицел', d:'+15% к шансу попадания', e:1},
    {id:'scan', n:'Сканер', d:'показывает тип соседних комнат', e:1},
    {id:'shield', n:'Щит', d:'поглощает 3 урона за бой', e:2},
    {id:'repair', n:'Ремонтник', d:'+2 к ядру при переходе', e:2},
    {id:'grip', n:'Манипулятор', d:'+50% найденного металла', e:1},
    {id:'regen', n:'Регенерат', d:'', e:1},
    {id:'cloak', n:'Невидимость', d:'', e:1},
    {id:'solar', n:'Солнечные панели', d:'', e:0}
];

var RN = ['Шлюз', 'Склад', 'Реакторная', 'Лаборатория', 'Жилой блок', 'Ангар', 'Мастерская', 'Пультовая', 'Оранжерея'];

var AGES = {
    anc: {n: 'Древняя', acc: [40, 60], ec: [4, 5], mc: [2, 3], core: 0.8},
    old: {n: 'Старая', acc: [60, 75], ec: [3, 4], mc: [1, 2], core: 0.9},
    new: {n: 'Новая', acc: [75, 90], ec: [1, 3], mc: [1, 1], core: 1}
};

var PW = {
    ok: {n: 'нормальное', res: 1, sc: 1, bot: 0},
    em: {n: 'аварийное', res: 0.8, sc: 1, bot: 7},
    off: {n: 'нет электричества', res: 0.2, sc: 0.75, bot: 15}
};

var SZ = {
    s: {n: 'Малая', r: [4, 5]},
    m: {n: 'Средняя', r: [6, 7]},
    l: {n: 'Большая', r: [8, 9]}
};

function curAge() {
    if (G && G.sts && G.sts[G.st - 1]) {
        return G.sts[G.st - 1].age;
    }
    return 'old';
}

function cs() {
    return G.sts[G.st - 1];
}

function gain(n) {
    var p = PW[cs().pw];
    return Math.max(1, Math.round(n * (act('scan') ? p.sc : p.res)));
}

function newW(mx, ag, gen) {
    if (mx === undefined) mx = 9;
    var A = AGES[ag || curAge()];
    var t = P(['e', 'm']);
    var dmg = R(3, mx);
    return {
        n: P(['Лазер', 'Рельса', 'Плазмоган', 'Дробовик', 'Пулемёт', 'Шокер', 'Игломёт']) + '-' + R(1, 9),
        t: t,
        dmg: dmg,
        acc: R(A.acc[0], A.acc[1]),
        c: t == 'e' ? R(A.ec[0], A.ec[1]) : R(A.mc[0], A.mc[1]),
        hp: R(5, 12),
        gen: gen || lootGen()
    };
}

function newM(ag, gen) {
    var baseMod = P(MODS);
    var m = {
        id: baseMod.id,
        n: baseMod.n,
        d: baseMod.d,
        e: baseMod.id == 'solar' ? 0 : Math.max(1, baseMod.e + R(-1, 1)),
        p: R(AGES[ag || curAge()].acc[0], AGES[ag || curAge()].acc[1]),
        hp: R(4, 10),
        on: true,
        left: 0,
        t: R(2, 5),
        cd: 0,
        gen: gen || lootGen()
    };
    if (m.id == 'regen') { m.a = R(2, 6); m.e = 0; }
    if (m.id == 'cloak') { m.e = R(3, 8); m.q = R(15, 40); m.b = R(10, 35); }
    if (m.id == 'armor') { m.q = R(15, 45); }
    if (m.id == 'shield') { m.q = R(2, 6); }
    if (m.id == 'repair') { m.m = R(2, 5); }
    if (m.id == 'solar') { m.s = R(8, 20); }
    return m;
}

function md(m) {
    var map = {
        armor: 'урон −' + m.q + '% на ' + m.t + ' ход.',
        sight: '+15% точность на ' + m.t + ' ход.',
        scan: 'видно комнаты ' + m.t + ' ход.',
        shield: 'поглощает ' + m.q + ' урона',
        repair: 'чинит ядро на 4–8 за ' + m.m + '🔩',
        grip: '+50% металла на ' + m.t + ' ход.',
        regen: 'АВТО: +' + m.a + '⚡/ход на ' + m.t + ' ход.',
        cloak: 'враг мажет чаще (−' + m.q + '%) на ' + m.t + ' ход.',
        solar: '+' + m.s + '⚡ на поверхности'
    };
    return map[m.id] || '';
}

var GEN = {
    100: {w:1, m:2, hp:20, cost:10},
    200: {w:1, m:2, hp:25, cost:20},
    300: {w:2, m:3, hp:30, cost:30},
    400: {w:2, m:3, hp:35, cost:40},
    500: {w:2, m:4, hp:40, cost:50}
};

function gn(g) { return 'X-' + g; }

function pickGen() {
    var x = R(1, 100);
    var weights = [[100, 30], [200, 28], [300, 20], [400, 14], [500, 8]];
    for (var i = 0; i < weights.length; i++) {
        if (x <= weights[i][1]) return weights[i][0];
        x -= weights[i][1];
    }
    return 100;
}

function lootGen() {
    return (ch(50) && G && G.robot) ? G.robot.gen : pickGen();
}

var PUNCH = {n: 'Удар манипулятором', t: '-', dmg: 2, acc: 75, c: 0};
var G;

function genRooms(n) {
    var rooms = [];
    for (var i = 0; i < n; i++) {
        rooms.push({
            name: i ? RN[i % RN.length] + (i > 8 ? ' ' + i : '') : 'Шлюз',
            adj: [],
            type: i ? (ch(45) ? 'e' : (ch(55) ? 'l' : 'x')) : 'x',
            vis: !i,
            clear: !i,
            loot: []
        });
    }
    var link = function(a, b) {
        if (a != b) {
            var found = false;
            for(var k=0; k<rooms[a].adj.length; k++) {
                if(rooms[a].adj[k] == b) found = true;
            }
            if(!found) {
                rooms[a].adj.push(b);
                rooms[b].adj.push(a);
            }
        }
    };
    for (var i = 1; i < n; i++) link(i, R(0, i - 1));
    for (var k = 0; k < n / 3; k++) link(R(0, n - 1), R(0, n - 1));
    var g = R(1, n - 1);
    rooms[g].type = 'g';
    rooms[g].name = 'Дробилка';
    
    var hasLab = false;
    for(var i=0; i<rooms.length; i++) {
        if(rooms[i].type == 'l') hasLab = true;
    }
    if (!hasLab) {
        var c = [];
        for(var i=1; i<rooms.length; i++) {
            if(rooms[i].type != 'g') c.push(i);
        }
        if(c.length > 0) rooms[P(c)].type = 'l';
    }
    
    var labs = [];
    for(var i=0; i<rooms.length; i++) {
        if(rooms[i].type == 'l') labs.push(rooms[i]);
    }
    if(labs.length > 0) P(labs).gE = true;
    return rooms;
}

function pickPw(a) {
    var w = {anc: [15, 40], old: [40, 40], new: [75, 22]}[a];
    var x = R(1, 100);
    return x <= w[0] ? 'ok' : (x <= w[0] + w[1] ? 'em' : 'off');
}

function genStation(o) {
    o = o || {};
    var sz = o.sz || P(['s', 'm', 'l']);
    var age = o.age || P(['anc', 'old', 'new']);
    var pw = o.pw || pickPw(age);
    return {
        name: P(['Арес', 'Фобос', 'Деймос', 'Олимп', 'Тарсис', 'Меридиан', 'Кратер', 'Гелиос', 'Утопия', 'Эллада']) + '-' + R(1, 99),
        sz: sz,
        age: age,
        pw: pw,
        rooms: genRooms(R(SZ[sz].r[0], SZ[sz].r[1])),
        sent: false
    };
}

function fillMap() {
    function okN() {
        var count = 0;
        for(var i=0; i<G.sts.length; i++) {
            if(!G.sts[i].sent && G.sts[i].pw == 'ok') count++;
        }
        return count;
    }
    while (okN() < 2) G.sts.push(genStation({pw: 'ok', age: P(['old', 'new'])}));
    
    function notSentN() {
        var count = 0;
        for(var i=0; i<G.sts.length; i++) {
            if(!G.sts[i].sent) count++;
        }
        return count;
    }
    while (notSentN() < 4) G.sts.push(genStation());
}

function stTag(s) {
    return SZ[s.sz].n + ' (' + s.rooms.length + ' комн.) · ' + AGES[s.age].n + ' · питание: ' + PW[s.pw].n;
}
function pc(x) { return Math.round(x * 100); }

function stFx(s) {
    var A = AGES[s.age], p = PW[s.pw];
    return '🔫 точность ' + A.acc[0] + '–' + A.acc[1] + '% · ⚡' + A.ec[0] + '–' + A.ec[1] + '/выстрел · 👾 прочность ' + pc(A.core) + '%<br>📦 ресурсы ' + pc(p.res) + '%' + (p.res < 1 ? ' (со сканером ' + pc(p.sc) + '%)' : '') + ' · 🤖 боты ' + (p.bot ? '−' + p.bot + '%' : 'в полную силу');
}

function bodiesAt(k) {
    var count = 0;
    for(var i=0; i<G.bodies.length; i++) {
        if(G.bodies[i].station === k) count++;
    }
    return count;
}

function mapCard(s, k) {
    return '<div class="card" style="margin:6px 0"><b>№' + (k + 1) + ' «' + s.name + '»</b>' + (k + 1 == G.st ? ' · <span class="ok">текущая</span>' : '') + (s.sent ? ' · <span class="ok">передана ✓</span>' : '') + '<div class="mu">' + stTag(s) + ' · исследовано ' + (function(){
        var cl = 0; for(var i=0; i<s.rooms.length; i++) if(s.rooms[i].clear) cl++; return cl;
    })() + '/' + s.rooms.length + '</div><div class="mu">' + stFx(s) + '</div>' + (bodiesAt(k) ? '<div class="mu">Тел: ' + bodiesAt(k) + '</div>' : '') + '<button class="p" onclick="drive(' + k + ')">' + (k + 1 == G.st ? 'Вернуться' : 'Лететь') + '</button></div>';
}

function newGame() {
    var st0 = genStation({sz: 's', age: 'new', pw: 'ok'});
    var rooms = st0.rooms;
    var n = rooms.length;
    var gen = pickGen();
    var gi = GEN[gen];
    var weps = [newW(9, 'old', gen)];
    if (gi.w > 1 && ch(50)) weps.push(newW(9, 'old', gen));
    
    G = {
        robot: {gen: gen, hp: gi.hp, max: gi.hp, weps: weps, mods: [newM('old', gen), newM('old', gen)]},
        bodies: [],
        en: 60,
        me: 10,
        ant: true,
        st: 1,
        rooms: rooms,
        cur: 0,
        prev: 0,
        fight: null,
        tg: 'c',
        sh: 0,
        log: ['Вы активированы на Марсе в теле ' + gn(gen) + '. Станция «' + st0.name + '»: ' + n + ' комнат. Исследуйте каждую и передайте данные антенной.'],
        over: null,
        sts: [st0],
        sent: 0,
        surf: false,
        rep: null
    };
    fillMap();
    render();
}

function L(s) { G.log.push(s); }

function act(id) {
    for(var i=0; i<G.robot.mods.length; i++) {
        if(G.robot.mods[i].id == id && G.robot.mods[i].left > 0) return true;
    }
    return false;
}

function tick() {
    for(var i=0; i<G.robot.mods.length; i++) {
        var m = G.robot.mods[i];
        if (m.id == 'regen') {
            if (m.left > 0) { G.en += m.a; m.left--; if (!m.left) m.cd = 3; }
            else if (m.cd > 0) { m.cd--; }
            else if (ch(m.p)) { m.left = m.t; }
        } else if (m.left > 0) {
            m.left--;
        }
    }
}

function drain() { return 0; }
function spend(n) { G.en = Math.max(0, G.en - n); }

function st(r) {
    if (r.vis) return r.clear ? '✓' : '⚔';
    return act('scan') ? ({e: 'враг', l: 'добыча', x: 'пусто', g: 'дробилка'}[r.type]) : '?';
}

function go(i) {
    if (G.en <= 0) return lose('Энергия на нуле. Вы обесточены.');
    spend(1 + drain());
    tick();
    G.rep = null;
    G.prev = G.cur;
    G.cur = i;
    var r = G.rooms[i];
    r.vis = true;
    
    if (act('repair') && G.robot.hp < G.robot.max) {
        G.robot.hp = Math.min(G.robot.max, G.robot.hp + 2);
    }
    if (!r.clear) {
        if (r.type == 'e') return startFight(r);
        r.clear = true;
        if (r.type == 'l') {
            var m = R(3, 8);
            if (act('grip')) m = Math.round(m * 1.5);
            m = gain(m);
            G.me += m;
            var s = 'Вы обыскали «' + r.name + '»: +' + m + ' металла';
            var x = r.gE ? 1 : R(1, 3);
            if (x == 1) {
                var e = gain(R(10, 20));
                G.en += e;
                s += ', +' + e + ' энергии';
            } else if (x == 2) {
                r.loot.push(ch(50) ? {k: 'w', v: newW()} : {k: 'm', v: newM()});
                s += ', найдена деталь';
            }
            L(s + '.');
        } else {
            L(r.type == 'g' ? 'Вы нашли дробилку: здесь разбор даёт полный металл.' : '«' + r.name + '»: пусто.');
        }
    } else {
        L('Вы в комнате «' + r.name + '».');
    }
    if (G.en <= 0) L('Энергия на нуле!');
    render();
}

function startFight(r) {
    var ageKey = curAge();
    var e = {
        n: P(['Дрон-охранник', 'Шагоход', 'Патрульный', 'Сборщик', 'Ржавый страж']) + '-' + R(10, 99),
        core: Math.round(R(16, 30) * AGES[ageKey].core),
        fx: {},
        sh: 0,
        en: R(6, 20),
        me: R(3, 10),
        parts: [],
        gen: pickGen()
    };
    e.max = e.core;
    var w = newW(7, undefined, e.gen);
    e.parts.push({t: 'w', v: w, hp: w.hp, max: w.hp});
    for (var k = R(0, 2); k > 0; k--) {
        var modItem = newM(undefined, e.gen);
        e.parts.push({t: 'm', v: modItem, hp: modItem.hp, max: modItem.hp});
    }
    G.fight = {e: e, r: r};
    G.tg = 'c';
    L('Бой! ' + e.n + ' преграждает путь.');
    render();
}

function chance(w) {
    var cloakBonus = (G.fight && G.fight.e.fx.cloak) ? G.fight.e.fx.cloak.q : 0;
    return Math.max(5, Math.min(95, w.acc + (act('sight') ? 15 : 0) - (G.tg != 'c' ? 10 : 0) - cloakBonus));
}

function canFire(w) {
    if (w.t == 'e') return G.en >= w.c;
    if (w.t == 'm') return G.me >= w.c;
    return true;
}

function shoot(w) {
    var e = G.fight.e;
    if (!canFire(w)) return;
    if (w.t == 'e') spend(w.c);
    else if (w.t == 'm') G.me -= w.c;
    
    if (ch(chance(w))) {
        if (G.tg == 'c') {
            var d = w.dmg;
            if (e.fx.armor) d = Math.max(1, Math.round(d * (1 - e.fx.armor.q / 100)));
            if (e.sh > 0) {
                var a = Math.min(e.sh, d);
                e.sh -= a;
                d -= a;
                L('Щит врага поглотил ' + a + '.');
            }
            e.core -= d;
            L('Попадание в ядро: −' + d + '.');
        } else {
            var p = e.parts[G.tg];
            p.hp -= w.dmg;
            if (p.hp <= 0) {
                p.dead = true;
                p.drop = ch(50);
                L((p.t == 'w' ? 'Оружие' : 'Модуль «' + p.v.n + '»') + ' врага выбито!');
                G.tg = 'c';
            } else {
                L('Попадание: −' + w.dmg + ' по детали.');
            }
        }
    } else {
        L('Промах.');
    }
    if (e.core <= 0) return win();
    round();
}

function enemyMods() {
    var e = G.fight.e;
    var ms = [];
    for(var i=0; i<e.parts.length; i++) {
        var p = e.parts[i];
        if (p.t == 'm' && !p.dead && ['armor', 'sight', 'shield', 'repair', 'cloak'].indexOf(p.v.id) >= 0 && !e.fx[p.v.id]) {
            if (!(p.v.id == 'shield' && e.sh > 0)) ms.push(p.v);
        }
    }
    if (!ms.length || !ch(55)) return;
    var m = P(ms), id = m.id;
    if (e.en < m.e || (id == 'repair' && (e.me < m.m || e.core >= e.max))) return;
    e.en -= m.e;
    if (!ch(m.p)) { L('Враг пытался включить модуль, но сбой.'); return; }
    if (id == 'repair') {
        e.me -= m.m;
        var h = R(3, 6);
        e.core = Math.min(e.max, e.core + h);
        L('Враг чинит ядро: +' + h + '.');
    } else if (id == 'shield') {
        e.sh = m.q;
        L('Враг включил щит.');
    } else {
        e.fx[id] = {t: m.t, q: m.q};
        L('Враг включил модуль.');
    }
}

function eTick() {
    var e = G.fight && G.fight.e;
    if (!e) return;
    for (var k in e.fx) {
        if (e.fx.hasOwnProperty(k)) {
            e.fx[k].t--;
            if (e.fx[k].t <= 0) delete e.fx[k];
        }
    }
    for(var i=0; i<e.parts.length; i++) {
        var p = e.parts[i];
        if (p.t == 'm' && !p.dead && p.v.id == 'regen' && ch(p.v.p)) e.en += R(1, p.v.a);
    }
}

function round() {
    spend(drain());
    var cloakActive = false;
    for(var i=0; i<G.robot.mods.length; i++) {
        if(G.robot.mods[i].id == 'cloak' && G.robot.mods[i].left > 0) cloakActive = G.robot.mods[i];
    }
    if (cloakActive && ch(cloakActive.b)) {
        L('Невидимость: враг потерял вас и пропустил ход.');
        tick();
        eTick();
        return render();
    }
    enemyMods();
    
    var e = G.fight.e, wp = e.parts[0];
    var w = wp.dead ? {dmg: 1, acc: 50} : wp.v;
    if (w.c) {
        if (w.t == 'e' ? e.en >= w.c : e.me >= w.c) {
            if (w.t == 'e') e.en -= w.c; else e.me -= w.c;
        } else {
            L('У врага кончились ресурсы — бьёт вплотную.');
            w = {dmg: 1, acc: 50};
        }
    }
    
    var cQ = 0;
    for(var i=0; i<G.robot.mods.length; i++) {
        if(G.robot.mods[i].id == 'cloak' && G.robot.mods[i].left > 0) cQ = G.robot.mods[i].q;
    }
    
    if (ch(Math.max(5, w.acc + (e.fx.sight ? 15 : 0) - cQ - PW[cs().pw].bot))) {
        var d = w.dmg;
        for(var i=0; i<G.robot.mods.length; i++) {
            if(G.robot.mods[i].id == 'armor' && G.robot.mods[i].left > 0) {
                d = Math.max(1, Math.round(d * (1 - G.robot.mods[i].q / 100)));
            }
        }
        if (G.sh > 0) {
            var a = Math.min(G.sh, d);
            G.sh -= a;
            d -= a;
            L('Щит поглотил ' + a + '.');
        }
        G.robot.hp -= d;
        L('Враг попал: −' + d + ' ядру.');
        if (G.ant && ch(12)) { G.ant = false; L('Антенна повреждена!'); }
    } else {
        L('Враг промахнулся.');
    }
    
    if (G.robot.hp <= 0) return lose('Ядро уничтожено.');
    tick();
    eTick();
    render();
}

function win() {
    var fData = G.fight;
    var e = fData.e, r = fData.r;
    G.fight = null;
    r.clear = true;
    var m = R(4, 10);
    if (act('grip')) m = Math.round(m * 1.5);
    m = gain(m);
    G.me += m;
    
    for(var i=0; i<e.parts.length; i++) {
        var p = e.parts[i];
        if (p.dead && p.drop) r.loot.push({k: p.t == 'w' ? 'w' : 'm', v: p.v});
    }
    
    var mx = GEN[e.gen].hp;
    var live = [];
    for(var i=0; i<e.parts.length; i++) {
        if(!e.parts[i].dead) live.push(e.parts[i]);
    }
    var liveW = [], liveM = [];
    for(var i=0; i<live.length; i++) {
        if(live[i].t == 'w') liveW.push(live[i].v);
        else liveM.push(live[i].v);
    }
    
    r.loot.push({
        k: 'body',
        v: {
            gen: e.gen,
            hp: Math.max(1, Math.round(mx * R(40, 90) / 100)),
            max: mx,
            weps: liveW,
            mods: liveM,
            coreDead: !ch(25)
        }
    });
    
    if (ch(30)) r.loot.push({k: 'a'});
    L('Победа! ' + e.n + ' уничтожен, +' + m + ' металла.');
    render();
}

function flee() {
    spend(1 + drain());
    if (ch(50)) {
        G.cur = G.prev;
        G.fight = null;
        L('Вы отступили.');
        render();
    } else {
        L('Отступить не удалось.');
        round();
    }
}

function lose(s) {
    G.over = s;
    G.fight = null;
    render();
}

function inG() { return G.rooms[G.cur].type == 'g'; }
function gv(b) { return Math.round(b * (inG() ? 1 : 0.4)); }
function val(it) {
    if (it.k == 'body') return gv(5) + gv(6);
    return gv(it.k == 'm' ? 5 : 6);
}

function repl(j) {
    var r = G.rooms[G.cur], it = r.loot[G.rep];
    if (!it) return;
    var arr = (it.k == 'w') ? G.robot.weps : G.robot.mods;
    var old = arr[j];
    arr[j] = it.v;
    r.loot[G.rep] = {k: it.k, v: old};
    G.rep = null;
    L('Заменено. Старая деталь лежит в комнате.');
    render();
}

function take(i) {
    G.rep = null;
    var r = G.rooms[G.cur], it = r.loot[i], ro = G.robot;
    if (it.k == 'body') {
        var b = it.v, c = GEN[b.gen].cost;
        if (b.coreDead && G.en < c) { L('Нужно ' + c + '⚡ для перезапуска ядра.'); return render(); }
        if (b.coreDead) { spend(c); b.coreDead = false; L('Ядро перезапущено (−' + c + '⚡).'); }
        
        G.bodies.push({gen: ro.gen, hp: ro.hp, max: ro.max, weps: ro.weps, mods: ro.mods, room: G.cur, station: G.st - 1});
        G.robot = {gen: b.gen, hp: b.hp, max: b.max, weps: b.weps, mods: b.mods};
        G.sh = 0;
        r.loot.splice(i, 1);
        L('Вы заняли тело ' + gn(b.gen) + '. Прежнее тело ' + gn(ro.gen) + ' осталось здесь.');
        return render();
    }
    if (it.k != 'a' && it.v.gen !== ro.gen) { L('Не подходит к модели ' + gn(ro.gen) + '.'); return render(); }
    if (it.k == 'w') {
        if (G.robot.weps.length >= GEN[ro.gen].w) { G.rep = i; return render(); }
        G.robot.weps.push(it.v);
    } else if (it.k == 'm') {
        if (G.robot.mods.length >= GEN[ro.gen].m) { G.rep = i; return render(); }
        G.robot.mods.push(it.v);
    } else {
        if (G.ant) return L('Ваша антенна цела — только в дробилку.'), render();
        G.ant = true;
        L('Антенна заменена.');
    }
    r.loot.splice(i, 1);
    render();
}

function swapBody(i) {
    var b = G.bodies[i], ro = G.robot;
    if (!b || G.fight) return;
    G.rep = null;
    G.bodies.splice(i, 1);
    G.bodies.push({gen: ro.gen, hp: ro.hp, max: ro.max, weps: ro.weps, mods: ro.mods, room: G.cur, station: G.st - 1});
    G.robot = {gen: b.gen, hp: b.hp, max: b.max, weps: b.weps, mods: b.mods};
    G.sh = 0;
    L('Вы пересели в тело ' + gn(b.gen) + '. Тело ' + gn(ro.gen) + ' осталось здесь.');
    render();
}

function grind(i) {
    var r = G.rooms[G.cur], it = r.loot[i];
    G.rep = null;
    if (it.k == 'body') {
        var b = it.v, v = val(it);
        G.me += v;
        r.loot.splice(i, 1);
        for(var k=0; k<b.weps.length; k++) r.loot.push({k: 'w', v: b.weps[k]});
        for(var k=0; k<b.mods.length; k++) r.loot.push({k: 'm', v: b.mods[k]});
        L((inG() ? 'Дробилка' : 'Вручную') + ': тело ' + gn(b.gen) + ' разобрано, +' + v + ' металла.');
        return render();
    }
    G.me += val(it);
    L((inG() ? 'Дробилка' : 'Вручную') + ': +' + val(it) + ' металла.');
    r.loot.splice(i, 1);
    render();
}

function grindOwn(t, i) {
    var a = (t == 'w') ? G.robot.weps : G.robot.mods;
    var v = gv(t == 'w' ? 6 : 5);
    a.splice(i, 1);
    G.me += v;
    L((inG() ? 'Дробилка' : 'Вручную') + ': +' + v + ' металла.');
    render();
}

function repairAntenna() {
    if (G.me >= 12) {
        G.me -= 12;
        G.ant = true;
        L('Антенна починена (−12 металла).');
        render();
    }
}

function useMod(i) {
    var m = G.robot.mods[i];
    if (m.id == 'repair' && G.me < m.m) return L('Нужно ' + m.m + '🔩 для ремонта.'), render();
    if (G.en < m.e) return L('Не хватает энергии для «' + m.n + '».'), render();
    spend(m.e);
    if (!ch(m.p)) { L(m.n + ': сбой, −' + m.e + '⚡.'); return render(); }
    if (m.id == 'shield') {
        G.sh = m.q;
        L('Щит включён (−' + m.e + '⚡).');
    } else if (m.id == 'repair') {
        var h = R(4, 8);
        G.robot.hp = Math.min(G.robot.max, G.robot.hp + h);
        G.me -= m.m;
        L('Ремонтник: +' + h + ' ядро (−' + m.e + '⚡, −' + m.m + '🔩).');
    } else {
        m.left = m.t;
        L(m.n + ' включён (−' + m.e + '⚡).');
    }
    render();
}

function sun(i) {
    var m = G.robot.mods[i];
    if (m.used) return;
    m.used = true;
    if (ch(m.p)) {
        G.en += m.s;
        L('Панели: +' + m.s + '⚡.');
    } else {
        L('Панели не сработали.');
    }
    render();
}

function runAway() {
    if (G.en < 20) return;
    spend(20);
    G.cur = G.prev;
    G.fight = null;
    L('Побег из комнаты (−20⚡).');
    render();
}

function surf() {
    if (G.en < 10) return;
    spend(10);
    G.fight = null;
    G.surf = true;
    for(var i=0; i<G.robot.mods.length; i++) G.robot.mods[i].used = false;
    L('Вы вышли на поверхность (−10⚡).');
    render();
}

function drive(k) {
    G.surf = false;
    G.rep = null;
    G.tg = 'c';
    G.st = k + 1;
    var s = G.sts[k];
    G.rooms = s.rooms;
    G.cur = 0;
    G.prev = 0;
    G.sh = 0;
    L('Вы прибыли на станцию №' + G.st + ' «' + s.name + '» (' + s.rooms.length + ' комнат).');
    render();
}

function report(s) {
    var n = s.rooms.length, en = 0;
    for(var i=0; i<s.rooms.length; i++) if(s.rooms[i].type == 'e') en++;
    var q = en / (n - 1);
    var lv = q < 0.25 ? 'низкая' : (q < 0.5 ? 'средняя' : 'высокая');
    s.q = q;
    L('Отчёт, станция №' + G.st + ': комнат ' + n + ', угроза — ' + lv + '.');
}

function verdict() {
    var a = [];
    for(var i=0; i<G.sts.length; i++) if(G.sts[i].sent) a.push(G.sts[i]);
    var sum = 0;
    for(var i=0; i<a.length; i++) sum += a[i].q;
    var m = sum / a.length;
    return m < 0.25 ? 'возвращаться безопасно' : (m < 0.5 ? 'нужна проверка' : 'возвращаться опасно');
}

function sendData() {
    var s = G.sts[G.st - 1];
    s.sent = true;
    G.sent++;
    fillMap();
    report(s);
    L('Данные станции №' + G.st + ' переданы на Землю! Всего: ' + G.sent + '.');
    render();
}

function bodyStr(b) {
    return 'Тело ' + gn(b.gen) + ' (HP ' + b.hp + '/' + b.max + (b.coreDead != null ? ', ядро ' + (b.coreDead ? 'мёртвое' : 'живое') : '') + ')';
}

function bodyEq(b) {
    var wNames = [];
    for(var i=0; i<b.weps.length; i++) wNames.push(b.weps[i].n + ' ' + b.weps[i].dmg + '/' + b.weps[i].acc + '%');
    var mNames = [];
    for(var i=0; i<b.mods.length; i++) mNames.push(b.mods[i].n);
    return '<div class="mu">' + (b.weps.length ? '🔫 ' + wNames.join(', ') : 'без оружия') + ' · ⚙ ' + (b.mods.length ? mNames.join(', ') : 'без модулей') + (b.coreDead ? ' · ядро ' + GEN[b.gen].cost + '⚡' : '') + '</div>';
}

function robLine() {
    var ro = G.robot, gi = GEN[ro.gen];
    return gn(ro.gen) + ' · HP ' + ro.hp + '/' + ro.max + ' · оружие ' + ro.weps.length + '/' + gi.w + ' · модули ' + ro.mods.length + '/' + gi.m;
}

function wd(w) { return w.n + ' · ' + w.dmg + ' ур. · ' + (w.t == 'e' ? '⚡' : '🔩') + w.c; }

function it2s(it) {
    if (it.k == 'a') return 'Антенна';
    if (it.k == 'body') return '<b>' + bodyStr(it.v) + '</b>' + bodyEq(it.v);
    if (it.k == 'w') return 'Оружие ' + gn(it.v.gen) + ': ' + wd(it.v) + ' · ' + it.v.acc + '% · HP ' + it.v.hp;
    return 'Модуль ' + gn(it.v.gen) + ': ' + it.v.n + ' (' + md(it.v) + ', −' + it.v.e + '⚡, ' + it.v.p + '%, HP ' + it.v.hp + ')';
}

function render() {
    var A = document.getElementById('app');
    if (G.over) {
        A.innerHTML = '<div class="card"><h3>Конец игры</h3><p>' + G.over + '</p><button class="p" onclick="newGame()">Новая игра</button></div>';
        return;
    }
    
    if (G.surf) {
        var solHtml = '';
        for(var i=0; i<G.robot.mods.length; i++) {
            var m = G.robot.mods[i];
            if(m.id == 'solar') {
                solHtml += '<div>' + m.n + ' (' + md(m) + ') <button class="p" ' + (m.used ? 'disabled' : '') + ' onclick="sun(' + i + ')">Развернуть</button></div>';
            }
        }
        var mapHtml = '';
        for(var i=0; i<G.sts.length; i++) {
            mapHtml += mapCard(G.sts[i], i);
        }
        var logHtml = '';
        var sliceLog = G.log.slice(-4);
        for(var i=0; i<sliceLog.length; i++) logHtml += '<div>' + sliceLog[i] + '</div>';

        A.innerHTML = '<div class="card"><h3>Поверхность Марса</h3><div>⚡ ' + G.en + ' · 🔩 ' + G.me + '</div>' + (G.sent ? '<div class="mu">Передано станций: ' + G.sent + ' · оценка: ' + verdict() + '</div>' : '') + solHtml + '<h3 style="margin-top:8px">Карта станций</h3>' + mapHtml + '</div><div class="card log">' + logHtml + '</div>';
        return;
    }
    
    var rs = G.rooms, r = rs[G.cur];
    var done = 0; for(var i=0; i<rs.length; i++) if(rs[i].clear) done++;
    var F = G.fight;
    
    var h = '<div class="card">';
    h += '<table class="st"><tr>';
    h += '<td><b class="' + (G.robot.hp < 10 ? 'bad' : '') + '">' + G.robot.hp + '/' + G.robot.max + '</b><span>ядро</span></td>';
    h += '<td><b>' + G.en + '</b><span>⚡ энерг.</span></td>';
    h += '<td><b>' + G.me + '</b><span>🔩 металл</span></td>';
    h += '<td><b class="' + (G.ant ? 'ok' : 'bad') + '">' + (G.ant ? 'ОК' : 'слом') + '</b><span>антенна</span></td>';
    h += '</tr></table>';
    h += '<div class="mu" style="text-align:center">' + robLine() + '</div></div>';
    
    h += '<div class="card"><h3>Станция №' + G.st + (G.sts[G.st - 1].sent ? ' ✓' : '') + ' · ' + r.name + ' · ' + done + '/' + rs.length + '</h3>';
    h += '<div class="mu">' + stTag(G.sts[G.st - 1]) + '</div>';
    
    if (F) {
        var e = F.e, S = act('scan');
        h += '<div><b>' + e.n + '</b> [' + gn(e.gen) + '] · ядро ' + (S ? e.core + '/' + e.max + ' · ⚡' + e.en + ' · 🔩' + e.me : 'скрыто') + '</div>';
        h += '<div class="mu">Куда бить:</div>';
        h += '<button class="' + (G.tg == 'c' ? 'sel' : '') + '" onclick="G.tg=\'c\';render()">Ядро</button>';
        for(var i=0; i<e.parts.length; i++) {
            var p = e.parts[i];
            h += '<button ' + (p.dead ? 'disabled ' : '') + 'class="' + (G.tg === i ? 'sel' : '') + '" onclick="G.tg=' + i + ';render()">' + (p.t == 'w' ? 'Оружие' : (S ? p.v.n : 'Модуль')) + (p.dead ? ' ✗' : '') + '</button>';
        }
        h += '<div class="mu">Атаковать:</div>';
        for(var i=0; i<G.robot.weps.length; i++) {
            var w = G.robot.weps[i];
            h += '<button class="p" ' + (canFire(w) ? '' : 'disabled ') + 'onclick="shoot(G.robot.weps[' + i + '])">' + wd(w) + ' · ' + chance(w) + '%</button>';
        }
        h += '<button class="p" onclick="shoot(PUNCH)">' + wd(PUNCH) + ' · ' + chance(PUNCH) + '%</button>';
        h += '<div><button onclick="flee()">Отступить (50%)</button><button onclick="runAway()" ' + (G.en >= 20 ? '' : 'disabled') + '>Побег (20⚡)</button></div>';
    } else {
        h += '<div class="mu">Выходы:</div>';
        for(var i=0; i<r.adj.length; i++) {
            var adjIdx = r.adj[i];
            var x = rs[adjIdx];
            h += '<button onclick="go(' + adjIdx + ')">' + x.name + ' [' + st(x) + ']</button>';
        }
        
        if (r.loot.length) {
            h += '<div class="mu">Добыча:</div>';
            for(var i=0; i<r.loot.length; i++) {
                var it = r.loot[i], bd = (it.k == 'body');
                h += '<div>' + it2s(it) + '<br><button ' + (bd ? 'class="p" ' : '') + 'onclick="take(' + i + ')">' + (bd ? 'Занять тело' : 'Взять') + '</button><button onclick="grind(' + i + ')">' + (bd ? 'Разобрать' : (inG() ? 'В дробилку' : 'Сломать')) + ' (+' + val(it) + ')</button></div>';
            }
        }
        
        var here = [];
        for(var i=0; i<G.bodies.length; i++) {
            if(G.bodies[i].room === G.cur && G.bodies[i].station === G.st - 1) here.push(i);
        }
        if (here.length) {
            h += '<div class="mu">Оставленные тела:</div>';
            for(var i=0; i<here.length; i++) {
                var bIdx = here[i], b = G.bodies[bIdx];
                h += '<div>' + bodyStr(b) + bodyEq(b) + '<button class="p" onclick="swapBody(' + bIdx + ')">Пересесть в ' + gn(b.gen) + '</button></div>';
            }
        }
        
        if (G.rep != null && r.loot[G.rep]) {
            var it = r.loot[G.rep];
            var arr = (it.k == 'w') ? G.robot.weps : G.robot.mods;
            h += '<div class="mu" style="margin-top:6px">Слоты полны. Новое: ' + it2s(it) + '<br>Что заменить?</div>';
            for(var j=0; j<arr.length; j++) {
                var o = arr[j];
                h += '<div>' + (it.k == 'w' ? wd(o) : o.n) + '<br><button class="p" onclick="repl(' + j + ')">Заменить это</button></div>';
            }
            h += '<button onclick="G.rep=null;render()">Отмена</button>';
        }
        
        h += '<div style="margin-top:6px">';
        if (!G.ant) h += '<button onclick="repairAntenna()" ' + (G.me >= 12 ? '' : 'disabled') + '>Починить антенну (12 🔩)</button>';
        h += '<button class="p" onclick="sendData()" ' + (done == rs.length && G.ant && !G.sts[G.st - 1].sent ? '' : 'disabled') + '>Передать данные</button>';
        if (G.cur == 0) h += '<button onclick="surf()" ' + (G.en >= 10 ? '' : 'disabled') + '>Поверхность (10⚡)</button>';
        h += '</div>';
    }
    h += '</div>';
    
    // Снаряжение
    h += '<div class="card"><h3>Снаряжение</h3>';
    for(var i=0; i<G.robot.weps.length; i++) {
        var w = G.robot.weps[i];
        h += '<div>🔫 [' + gn(w.gen) + '] ' + wd(w) + ' · ' + w.acc + '% ' + (F ? '' : '<button onclick="grindOwn(\'w\',' + i + ')">сломать</button>') + '</div>';
    }
    for(var i=0; i<G.robot.mods.length; i++) {
        var m = G.robot.mods[i];
        h += '<div>⚙ <b>' + m.n + '</b> (' + md(m) + ') ' + (m.id == 'regen' || m.id == 'solar' ? '' : '<button class="p" onclick="useMod(' + i + ')">Вкл</button>') + (F ? '' : '<button onclick="grindOwn(\'m\',' + i + ')">сломать</button>') + '</div>';
    }
    h += '</div>';
    
    // Журнал
    var logHtml = '';
    var sliceLog2 = G.log.slice(-6);
    for(var i=0; i<sliceLog2.length; i++) logHtml += '<div>' + sliceLog2[i] + '</div>';
    h += '<div class="card log"><h3>Журнал</h3>' + logHtml + '</div>';
    
    A.innerHTML = h;
}

window.onload = function() {
    newGame();
};
</script>
</body>
</html>
